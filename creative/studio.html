<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Creative Idea Studio</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#f8f4ff;background:#161322}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 40px}main{max-width:760px;margin:auto}header{padding:24px 0 12px}h1{margin:6px 0;font-size:29px}p,small{color:#c2b8d1;line-height:1.6}.card{background:#29243b;border:1px solid #544968;border-radius:18px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit}button{border:1px solid #66567d;border-radius:12px;background:#423653;color:#fff;padding:11px 13px;cursor:pointer}button.primary{background:#d6b4ff;color:#23182d;font-weight:700}button.active{background:#7954a8}input,textarea,select{width:100%;background:#171326;color:white;border:1px solid #66567d;border-radius:10px;padding:12px;margin:7px 0 12px}textarea{min-height:95px}label{display:block;margin-top:8px;font-size:14px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1}.node{border-left:3px solid #a889d6;margin:8px 0 8px 12px;padding:8px 10px;background:#352b49;border-radius:7px}.node button{padding:5px 8px;font-size:12px;margin-left:8px}.tree{overflow:auto;max-height:60vh}.hint{font-size:13px}.tag{font-size:12px;background:#544267;padding:4px 8px;border-radius:20px}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #51445e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(max-width:390px){.grid{grid-template-columns:1fr}}a{color:#e2c5ff}</style></head><body><main><header><a href="./">← Creative Toolsに戻る</a><h1>✦ Idea Studio</h1><p>世界観ツリー × マインドマップ × SCAMPER。発想は仮説として保存し、正式設定は自動変更しません。</p></header><div class="card"><strong>🌌 ビジュアル世界観マップ</strong><p>ノードを指で動かして、設定同士のつながりを俯瞰できます。</p><a href="./map.html" style="display:inline-block;background:#d6b4ff;color:#23182d;padding:12px;border-radius:10px;text-decoration:none;font-weight:700">マップを開く</a></div><div class="tabs"><button class="active" data-tab="tree">世界観ツリー</button><button data-tab="ideas">発想ラボ</button><button data-tab="evolution">進化ツリー</button></div><section id="tree" class="card"><h2>世界観ツリー</h2><p class="hint">ノードを追加し、親子関係で設定を整理します。既存メモは変更しません。</p><label>名称<input id="node-title" placeholder="例：鏡の国"></label><label>親ノード<select id="node-parent"></select></label><label>分類<select id="node-type"><option>世界観</option><option>国家</option><option>人物</option><option>能力</option><option>事件</option><option>組織</option><option>その他</option></select></label><label>説明<textarea id="node-detail" placeholder="設定や検討事項"></textarea></label><button class="primary" id="add-node">ノードを追加</button><div id="tree-view" class="tree"></div></section><section id="ideas" class="card hidden"><h2>発想ラボ</h2><label>検討テーマ<input id="topic" placeholder="例：イーコールの正体"></label><label>発想手法<select id="method"><option value="scamper">SCAMPER</option><option value="mind">マインドマップ</option><option value="reverse">逆ブレインストーミング</option><option value="why">5 Whys</option></select></label><button class="primary" id="generate">問いを展開</button><div id="prompts"></div><label>思いついた案<textarea id="idea-text" placeholder="発想を自由に記録"></textarea></label><label>元になった案<select id="idea-parent"></select></label><button class="primary" id="save-idea">候補として保存</button><p id="feedback" role="status"></p></section><section id="evolution" class="card hidden"><h2>アイデア進化ツリー</h2><p class="hint">派生案を残し、検討中・保留・採用を切り替えられます。</p><div id="idea-list"></div></section><div class="card"><h3>バックアップ</h3><p class="hint">このスタジオのデータはブラウザ内に保存。機種変更・Safariのデータ削除に備え、JSONで保存してください。</p><div class="actions"><button id="export">JSONを書き出す</button><label>JSONを読み込む<input id="import" type="file" accept=".json,application/json"></label></div><p id="import-status" role="status"></p></div></main><script>(()=>{'use strict';const KEY='creative-idea-studio-v1',base={nodes:[{id:'root',parent:null,title:'カイの咆哮',type:'世界観',detail:''}],ideas:[]};let data;try{const d=JSON.parse(localStorage.getItem(KEY));data=d&&Array.isArray(d.nodes)&&Array.isArray(d.ideas)?d:structuredClone(base)}catch{data=structuredClone(base)}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('保存できませんでした');return false}},id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))});function options(){const valid=data.nodes.filter(n=>n&&typeof n.id==='string');$('node-parent').innerHTML=valid.map(n=>'<option value="'+esc(n.id)+'">'+esc(n.title)+'</option>').join('');$('idea-parent').innerHTML='<option value="">派生元なし</option>'+data.ideas.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.title)+'</option>').join('')}function tree(){options();const visited=new Set();function draw(parent,depth){if(depth>30)return'';return data.nodes.filter(n=>n.parent===parent&&!visited.has(n.id)).map(n=>{visited.add(n.id);return '<div class="node" style="margin-left:'+Math.min(depth*12,100)+'px"><strong>'+esc(n.title)+'</strong> <span class="tag">'+esc(n.type)+'</span> <button data-remove="'+esc(n.id)+'">削除</button>'+(n.detail?'<p>'+esc(n.detail)+'</p>':'')+draw(n.id,depth+1)+'</div>'}).join('')} $('tree-view').innerHTML=draw(null,0);$('tree-view').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(b.dataset.remove==='root')return alert('ルートは削除できません');if(!confirm('このノードと子ノードを削除しますか？'))return;const doomed=new Set([b.dataset.remove]);let changed=true;while(changed){changed=false;data.nodes.forEach(n=>{if(doomed.has(n.parent)&&!doomed.has(n.id)){doomed.add(n.id);changed=true}})}data.nodes=data.nodes.filter(n=>!doomed.has(n.id));save();tree()})}$('add-node').onclick=()=>{const title=$('node-title').value.trim();if(!title)return alert('名称を入力してください');data.nodes.push({id:id(),parent:$('node-parent').value||'root',title,type:$('node-type').value,detail:$('node-detail').value.trim()});if(save()){$('node-title').value='';$('node-detail').value='';tree()}};const questions={scamper:[['S 置換','何を別の要素に置き換える？'],['C 結合','何と組み合わせる？'],['A 応用','他分野の仕組みを応用できる？'],['M 変更','規模・範囲・性質を変えると？'],['P 転用','別の用途に使うと？'],['E 除去','何を取り除くと面白い？'],['R 逆転','因果・立場・結果を逆転すると？']],mind:[['中心','テーマを構成する要素は？'],['人物','誰が関わる？'],['場所','どこで起きる？'],['歴史','何が原因となった？'],['対立','何と衝突する？'],['意外性','予想外のつながりは？']],reverse:[['失敗','この案をつまらなくするには？'],['矛盾','どこが破綻しやすい？'],['反転','失敗条件を防ぐには？']],why:[['なぜ1','なぜ必要？'],['なぜ2','その理由が重要なのはなぜ？'],['なぜ3','根本の欲求は？'],['なぜ4','別の方法ではだめ？'],['なぜ5','最終的に何を伝えたい？']]};$('generate').onclick=()=>{$('prompts').innerHTML='<div class="grid">'+questions[$('method').value].map(q=>'<div class="node"><strong>'+esc(q[0])+'</strong><p>'+esc(q[1])+'</p></div>').join('')+'</div>'};$('save-idea').onclick=()=>{const title=$('topic').value.trim(),body=$('idea-text').value.trim();if(!title||!body)return $('feedback').textContent='テーマと案を入力してください';data.ideas.push({id:id(),title,body,parent:$('idea-parent').value||null,method:$('method').value,status:'検討中',date:new Date().toISOString()});if(save()){$('idea-text').value='';$('feedback').textContent='候補として保存しました';renderIdeas()}};function renderIdeas(){options();$('idea-list').innerHTML=data.ideas.map(i=>'<div class="item"><strong>'+esc(i.title)+'</strong> <span class="tag">'+esc(i.status)+'</span><p>'+esc(i.body)+'</p><small>発想法: '+esc(i.method)+' / 派生元: '+esc(data.ideas.find(x=>x.id===i.parent)?.title||'なし')+'</small><div class="actions"><button data-status="'+esc(i.id)+'">状態変更</button><button data-derive="'+esc(i.id)+'">派生案を作る</button><button data-delete="'+esc(i.id)+'">削除</button></div></div>').join('')||'<p>候補はまだありません。</p>';$('idea-list').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const i=data.ideas.find(x=>x.id===b.dataset.status);i.status=({検討中:'保留',保留:'採用',採用:'検討中'})[i.status]||'検討中';save();renderIdeas()});$('idea-list').querySelectorAll('[data-derive]').forEach(b=>b.onclick=()=>{$('idea-parent').value=b.dataset.derive;$('topic').value=data.ideas.find(x=>x.id===b.dataset.derive).title;document.querySelector('[data-tab="ideas"]').click()});$('idea-list').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('この候補を削除しますか？'))return;data.ideas=data.ideas.filter(x=>x.id!==b.dataset.delete);data.ideas.forEach(x=>{if(x.parent===b.dataset.delete)x.parent=null});save();renderIdeas()})}$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({format:KEY,...data},null,2)],{type:'application/json'}));a.href=u;a.download='creative-idea-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};$('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!==KEY||!Array.isArray(d.nodes)||!Array.isArray(d.ideas)||d.nodes.length>10000||d.ideas.length>10000||!d.nodes.every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.parent!=='undefined')||!d.ideas.every(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.body==='string'))throw Error('形式が違います');if(!confirm('スタジオの現在のデータをバックアップで置き換えますか？'))return;const old=data;data={nodes:d.nodes,ideas:d.ideas};if(!save())data=old;tree();renderIdeas();$('import-status').textContent='読み込みました'}catch{$('import-status').textContent='読み込みに失敗しました'}}};tree();renderIdeas()})();</script></body></html>
