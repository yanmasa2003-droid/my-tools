<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111922"><title>World Atlas | カイの咆哮</title><style>
:root{--ink:#eee8d9;--muted:#b8b5aa;--gold:#d7b777;--line:rgba(218,190,133,.25);--paper:#1c2730;--bg:#101922;font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#364b55 0%,transparent 50%),repeating-linear-gradient(120deg,transparent 0 64px,rgba(216,189,130,.015) 65px 66px),#101922;padding:env(safe-area-inset-top) 16px 50px}
main{max-width:840px;margin:auto}a{color:var(--gold)}header{padding:25px 0 16px;text-align:center}.eyebrow{font:11px -apple-system,sans-serif;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}.seal{width:56px;height:56px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:18px auto 12px;font-size:29px;box-shadow:0 0 0 7px rgba(215,183,119,.06)}h1{font-size:clamp(32px,7vw,52px);font-weight:500;letter-spacing:.05em;margin:6px 0}h2{font-weight:500;font-size:23px;margin:0 0 10px}.intro{font-size:14px;line-height:1.9;color:var(--muted);margin:14px auto;max-width:530px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5;margin:20px 0}.panel{background:linear-gradient(145deg,rgba(38,52,60,.95),rgba(21,32,42,.96));border:1px solid var(--line);border-radius:4px;padding:19px;margin:16px 0;box-shadow:0 14px 40px rgba(0,0,0,.16)}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.count{font:12px -apple-system,sans-serif;color:var(--gold);border:1px solid var(--line);padding:7px 10px;border-radius:30px;white-space:nowrap}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.category{position:relative;min-height:165px;overflow:hidden;text-align:left;border:1px solid var(--line);background:linear-gradient(140deg,rgba(102,116,111,.16),rgba(18,30,41,.95));color:var(--ink);padding:18px 14px;cursor:pointer;border-radius:3px;transition:transform .2s,border-color .2s}.category:active{transform:scale(.98)}.category:focus-visible,.entry:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.category:before{content:"";position:absolute;width:130px;height:130px;border:1px solid rgba(215,183,119,.11);border-radius:50%;right:-45px;top:-42px;box-shadow:0 0 0 24px rgba(215,183,119,.035)}.category .glyph{font-size:34px;display:block;margin-bottom:22px;color:var(--gold);font-family:serif}.category strong{font-size:21px;font-weight:500;display:block}.category small{display:block;color:var(--muted);font:12px -apple-system,sans-serif;margin-top:8px}.category.active{border-color:var(--gold);background:linear-gradient(140deg,rgba(115,95,56,.25),#26323a)}.back{background:none;color:var(--gold);border:0;padding:6px 0 16px;cursor:pointer}.entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:rgba(255,255,255,.025);color:var(--ink);border:1px solid rgba(215,183,119,.13);padding:16px;margin:9px 0;border-radius:3px;cursor:pointer}.entry strong{font-weight:500;font-size:17px}.entry small{display:block;font:12px/1.6 -apple-system,sans-serif;color:var(--muted);margin-top:7px}.entry .arrow{color:var(--gold)}.entry.selected{border-color:var(--gold)}.hidden{display:none!important}input,select,textarea{width:100%;background:#101b24;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:13px;font:15px -apple-system,sans-serif;margin:7px 0 14px}textarea{min-height:135px;line-height:1.7}label{display:block;font:12px -apple-system,sans-serif;color:var(--gold);margin-top:10px}.primary{border:1px solid var(--gold);color:#16212b;background:var(--gold);padding:13px 18px;font:600 14px -apple-system,sans-serif;border-radius:3px;cursor:pointer}.description{font:14px/1.8 -apple-system,sans-serif;color:var(--muted)}.source{display:block;overflow-wrap:anywhere;font:12px/1.7 -apple-system,sans-serif}.foot{text-align:center;color:var(--muted);font:12px/1.8 -apple-system,sans-serif;padding:15px}.status{font:13px -apple-system,sans-serif;color:var(--gold)}@media(min-width:650px){.categories{grid-template-columns:repeat(3,minmax(0,1fr))}.category{min-height:190px;padding:22px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><main><header><a href="./studio.html" style="display:block;text-align:left;font:13px -apple-system,sans-serif">← Idea Studio</a><div class="seal" aria-hidden="true">✧</div><div class="eyebrow">THE ARCHIVE OF KAI</div><h1>World Atlas</h1><div class="eyebrow">カイの咆哮 — 世界設定図鑑</div><p class="intro">世界の断片を辿り、人物を知り、法則を紐解く。記録された設定を、ひとつずつ探索するための図鑑。</p><div class="rule"></div></header><section class="panel" id="overview"><div class="heading"><h2>収蔵目録</h2><span id="total" class="count"></span></div><p class="description">展示室を選んで設定を閲覧できます。</p><div id="categories" class="categories"></div><div id="empty" class="hidden"><p class="description">このブラウザには世界観ツリーのデータがありません。ホーム画面版とSafariでは保存領域が異なることがあります。</p><a href="./import-tree.html">設定を一括取り込み</a></div></section><section class="panel hidden" id="collection"><button id="back" class="back">← 収蔵目録へ</button><div class="heading"><h2 id="collection-name"></h2><span id="collection-count" class="count"></span></div><label for="search">収蔵品を探す</label><input id="search" type="search" placeholder="設定名・説明から検索"><div id="entries"></div></section><section class="panel hidden" id="record"><div class="eyebrow">ARCHIVE RECORD</div><h2 id="record-title" style="margin-top:13px"></h2><p id="record-desc" class="description"></p><a id="source" class="source hidden" target="_blank" rel="noopener noreferrer">Notionの出典を開く</a><div class="rule"></div><details><summary style="color:var(--gold);cursor:pointer">設定を編集する</summary><label for="edit-title">名称</label><input id="edit-title"><label for="edit-type">分類</label><select id="edit-type"><option>国家</option><option>人物</option><option>能力</option><option>組織</option><option>事件</option><option>世界観</option><option>その他</option></select><label for="edit-desc">説明</label><textarea id="edit-desc"></textarea><button id="save" class="primary">変更を保存</button><p id="status" class="status" role="status"></p></details></section><footer class="foot">保存済み設定を閲覧・編集します。Notion原本への自動書き込みは行いません。</footer></main><script>(()=>{'use strict';const KEY='creative-idea-studio-v1',$=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.nodes))data={nodes:[],ideas:[]};const kinds=['国家','人物','能力','組織','事件','世界観','その他'],symbols={'国家':'♜','人物':'♙','能力':'✧','組織':'⚜','事件':'✦','世界観':'◈','その他':'◇'};let active=null,chosen=null;const nodes=()=>data.nodes.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&n.id!=='root');const isFolder=n=>n.parent==='root'&&kinds.includes(n.title)&&n.type==='世界観'&&n.detail==='自動作成した分類フォルダ';const kind=n=>{if(isFolder(n))return null;if(kinds.includes(n.type)&&n.type!=='世界観')return n.type;const p=data.nodes.find(x=>x.id===n.parent);if(p&&isFolder(p))return p.title;return kinds.includes(n.type)?n.type:'その他'};const items=k=>nodes().filter(n=>kind(n)===k);function renderCategories(){const list=nodes().filter(n=>!isFolder(n));$('total').textContent=list.length+' RECORDS';$('categories').replaceChildren();$('empty').classList.toggle('hidden',list.length!==0);for(const k of kinds){const n=items(k);if(!n.length)continue;const b=document.createElement('button');b.className='category'+(active===k?' active':'');const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=symbols[k];const name=document.createElement('strong');name.textContent=k;const count=document.createElement('small');count.textContent=String(n.length).padStart(2,'0')+' RECORDS';b.append(glyph,name,count);b.onclick=()=>{active=k;chosen=null;$('record').classList.add('hidden');$('search').value='';renderCategories();renderEntries();$('collection').classList.remove('hidden');$('collection').scrollIntoView({behavior:'smooth',block:'start'})};$('categories').append(b)}}function renderEntries(){if(!active)return;const list=items(active),q=$('search').value.trim().toLocaleLowerCase();$('collection-name').textContent=active;$('collection-count').textContent=list.length+'件';$('entries').replaceChildren();for(const n of list.filter(n=>(n.title+' '+(n.detail||'')).toLocaleLowerCase().includes(q))){const b=document.createElement('button');b.className='entry'+(chosen===n.id?' selected':'');const info=document.createElement('span');const title=document.createElement('strong');title.textContent=n.title;const sub=document.createElement('small');sub.textContent=(n.detail||'記述なし').replace(/\[出典: https?:\/\/[^\]]+\]/g,'').slice(0,85);info.append(title,sub);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';b.append(info,arrow);b.onclick=()=>{chosen=n.id;renderEntries();showRecord();$('record').scrollIntoView({behavior:'smooth',block:'nearest'})};$('entries').append(b)}if(!$('entries').children.length){const p=document.createElement('p');p.className='description';p.textContent='該当する記録はありません。';$('entries').append(p)}}function showRecord(){const n=data.nodes.find(x=>x.id===chosen);$('record').classList.toggle('hidden',!n);if(!n)return;$('record-title').textContent=n.title;const raw=n.detail||'';const match=raw.match(/\[出典: (https:\/\/app\.notion\.com\/p\/[a-zA-Z0-9]+)\]/);$('record-desc').textContent=raw.replace(/\[出典: https?:\/\/[^\]]+\]/g,'').trim()||'まだ説明はありません。';$('source').classList.toggle('hidden',!match);if(match)$('source').href=match[1];else $('source').removeAttribute('href');$('edit-title').value=n.title;$('edit-type').value=kinds.includes(n.type)?n.type:'その他';$('edit-desc').value=raw;$('status').textContent=''}$('search').oninput=renderEntries;$('back').onclick=()=>{active=null;chosen=null;$('collection').classList.add('hidden');$('record').classList.add('hidden');renderCategories();window.scrollTo({top:0,behavior:'smooth'})};$('save').onclick=()=>{const n=data.nodes.find(x=>x.id===chosen),title=$('edit-title').value.trim();if(!n||!title){$('status').textContent='名称を入力してください';return}const old={...n};n.title=title;n.type=$('edit-type').value;n.detail=$('edit-desc').value;try{localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='保存しました';renderCategories();renderEntries();showRecord()}catch{Object.assign(n,old);$('status').textContent='保存できませんでした'}};renderCategories()})();</script></body></html>
