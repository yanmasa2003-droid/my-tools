<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Visual World Map</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#171322;color:#fff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px 24px}main{max-width:900px;margin:auto}a{color:#e3caff}header{padding:18px 4px}h1{font-size:25px;margin:9px 0}p{color:#c9bdd8;line-height:1.5}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}button,input,select,textarea{font:inherit}button{background:#453557;color:#fff;border:1px solid #77628f;border-radius:10px;padding:9px 12px}button.primary{background:#d9b8ff;color:#24132f;font-weight:bold}#viewport{position:relative;height:min(65vh,580px);min-height:350px;background:radial-gradient(ellipse at 20% 20%,#3b2a57,#211b32 55%,#141321);border:1px solid #665579;border-radius:18px;overflow:hidden;touch-action:none}#map{width:100%;height:100%;display:block;touch-action:none}#map .edge{stroke:#a48abd;stroke-width:2;opacity:.7}#map .node rect{fill:#413356;stroke:#9b7cb8;stroke-width:1.5}#map .node.selected rect{fill:#75519d;stroke:#e7cbff;stroke-width:2.5}#map text{fill:#fff;font-size:14px;pointer-events:none;user-select:none}#map .node{cursor:grab;touch-action:none}#map .node:active{cursor:grabbing}.card{background:#29223b;border:1px solid #5b4a6c;border-radius:15px;padding:15px;margin-top:12px}label{display:block;margin:9px 0 4px;color:#d6c7e4}input,textarea,select{width:100%;background:#171324;color:white;border:1px solid #76628a;border-radius:10px;padding:11px}textarea{min-height:80px}small{color:#c9bdd8}#empty{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;color:#ddd}#viewport:has(svg:empty) #empty{display:grid}</style></head><body><main><header><a href="./studio.html">← Idea Studioに戻る</a><h1>✦ Visual World Map</h1><p>設定ノードを指で動かして配置。線は世界観ツリーの親子関係です。配置はこの端末に保存されます。</p></header><div class="bar"><button id="fit">全体表示</button><button id="reset">配置を整列</button><label style="margin:0">拡大率 <input id="zoom" type="range" min="45" max="180" value="100" style="width:120px;vertical-align:middle"></label><small id="count"></small></div><div id="viewport"><svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="世界観の関係性マップ"></svg><div id="empty">世界観ツリーに設定を追加してください</div></div><div class="card"><h2 style="margin-top:0">ノードの詳細</h2><p id="selection">マップ上のノードをタップすると編集できます。</p><div id="editor" hidden><label>名称<input id="title"></label><label>分類<select id="type"><option>世界観</option><option>国家</option><option>人物</option><option>能力</option><option>事件</option><option>組織</option><option>その他</option></select></label><label>説明<textarea id="detail"></textarea></label><button class="primary" id="save">変更を保存</button> <button id="focus">選択ノードを中央へ</button></div></div><p><small>既存の世界観ツリーと同じデータを使用します。Notionとの同期やAI自動生成はありません。</small></p></main><script>(()=>{'use strict';const KEY='creative-idea-studio-v1',POS='creative-visual-map-positions-v1',$=x=>document.getElementById(x);let data,positions,selected=null,drag=null,zoom=1,offset={x:0,y:0};try{data=JSON.parse(localStorage.getItem(KEY))||{nodes:[],ideas:[]}}catch{data={nodes:[],ideas:[]}}if(!Array.isArray(data.nodes))data.nodes=[];try{positions=JSON.parse(localStorage.getItem(POS))||{}}catch{positions={}}const nodes=data.nodes.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'),byId=new Map(nodes.map(n=>[n.id,n]));function initial(){const depth=new Map(),groups=new Map();function d(n,seen=new Set()){if(depth.has(n.id))return depth.get(n.id);if(seen.has(n.id))return 0;seen.add(n.id);const p=byId.get(n.parent),v=p?Math.min(10,d(p,seen)+1):0;depth.set(n.id,v);return v}nodes.forEach(n=>{const v=d(n);if(!groups.has(v))groups.set(v,[]);groups.get(v).push(n)});for(const [level,group] of groups)group.forEach((n,i)=>{if(!positions[n.id]||!Number.isFinite(positions[n.id].x)||!Number.isFinite(positions[n.id].y))positions[n.id]={x:level*230+90,y:(i-(group.length-1)/2)*110+260}})}initial();const svg=$('map'),ns='http://www.w3.org/2000/svg';function el(tag,attrs={}){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}function bounds(){const w=$('viewport').clientWidth,h=$('viewport').clientHeight;return{w,h}}function coords(ev){const r=svg.getBoundingClientRect();return{x:(ev.clientX-r.left-offset.x)/zoom,y:(ev.clientY-r.top-offset.y)/zoom}}function render(){svg.replaceChildren();const g=el('g',{transform:'translate('+offset.x+' '+offset.y+') scale('+zoom+')'});svg.appendChild(g);nodes.forEach(n=>{const p=byId.get(n.parent);if(!p)return;const a=positions[p.id],b=positions[n.id];g.appendChild(el('line',{x1:a.x+76,y1:a.y+23,x2:b.x+76,y2:b.y+23,class:'edge'}))});nodes.forEach(n=>{const p=positions[n.id],group=el('g',{class:'node'+(selected===n.id?' selected':''),transform:'translate('+p.x+' '+p.y+')','data-id':n.id});group.appendChild(el('rect',{width:152,height:48,rx:13}));const t=el('text',{x:76,y:20,'text-anchor':'middle'});const name=n.title.length>12?n.title.slice(0,11)+'…':n.title;t.textContent=name;group.appendChild(t);const sub=el('text',{x:76,y:36,'text-anchor':'middle',style:'font-size:10px;fill:#d4c3e3'});sub.textContent=n.type||'設定';group.appendChild(sub);g.appendChild(group);group.addEventListener('pointerdown',ev=>{ev.preventDefault();selected=n.id;const pt=coords(ev);drag={id:n.id,dx:pt.x-p.x,dy:pt.y-p.y,moved:false};group.setPointerCapture(ev.pointerId);show();renderSelectionOnly()});group.addEventListener('pointermove',ev=>{if(!drag||drag.id!==n.id)return;const pt=coords(ev);positions[n.id]={x:pt.x-drag.dx,y:pt.y-drag.dy};drag.moved=true;g.querySelectorAll('.edge').forEach(x=>x.remove());nodes.forEach(k=>{const parent=byId.get(k.parent);if(parent){const a=positions[parent.id],b=positions[k.id];g.insertBefore(el('line',{x1:a.x+76,y1:a.y+23,x2:b.x+76,y2:b.y+23,class:'edge'}),g.firstChild)}});group.setAttribute('transform','translate('+positions[n.id].x+' '+positions[n.id].y+')')});group.addEventListener('pointerup',()=>{if(drag){try{localStorage.setItem(POS,JSON.stringify(positions))}catch{}drag=null;render()}});group.addEventListener('pointercancel',()=>{drag=null;render()})});$('count').textContent=nodes.length+'ノード'}function renderSelectionOnly(){svg.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===selected))}function show(){const n=byId.get(selected);$('editor').hidden=!n;$('selection').textContent=n?'選択中：'+n.title:'ノードをタップしてください';if(!n)return;$('title').value=n.title;$('detail').value=n.detail||'';$('type').value=[...$('type').options].some(o=>o.value===n.type)?n.type:'その他'}$('save').onclick=()=>{const n=byId.get(selected);if(!n)return;const title=$('title').value.trim();if(!title)return alert('名称を入力してください');n.title=title;n.type=$('type').value;n.detail=$('detail').value;try{localStorage.setItem(KEY,JSON.stringify(data));show();render()}catch{alert('保存できませんでした')}};$('zoom').oninput=e=>{zoom=Number(e.target.value)/100;render()};function fit(){if(!nodes.length)return;const xs=nodes.map(n=>positions[n.id].x),ys=nodes.map(n=>positions[n.id].y),minx=Math.min(...xs),maxx=Math.max(...xs)+152,miny=Math.min(...ys),maxy=Math.max(...ys)+48,{w,h}=bounds();zoom=Math.max(.45,Math.min(1.8,(w-32)/Math.max(1,maxx-minx),(h-32)/Math.max(1,maxy-miny)));offset={x:(w-(maxx-minx)*zoom)/2-minx*zoom,y:(h-(maxy-miny)*zoom)/2-miny*zoom};$('zoom').value=Math.round(zoom*100);render()}$('fit').onclick=fit;$('reset').onclick=()=>{if(!confirm('ノードの配置を初期状態に戻しますか？'))return;positions={};initial();try{localStorage.setItem(POS,JSON.stringify(positions))}catch{}fit()};$('focus').onclick=()=>{if(!selected)return;const p=positions[selected],{w,h}=bounds();offset={x:w/2-(p.x+76)*zoom,y:h/2-(p.y+24)*zoom};render()};let pan=null;svg.addEventListener('pointerdown',ev=>{if(ev.target.closest('.node'))return;pan={x:ev.clientX,y:ev.clientY,ox:offset.x,oy:offset.y};svg.setPointerCapture(ev.pointerId)});svg.addEventListener('pointermove',ev=>{if(!pan)return;offset={x:pan.ox+ev.clientX-pan.x,y:pan.oy+ev.clientY-pan.y};render()});svg.addEventListener('pointerup',()=>pan=null);svg.addEventListener('pointercancel',()=>pan=null);window.addEventListener('resize',fit);fit()})();</script></body></html>
