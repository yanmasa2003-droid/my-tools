<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Atlas · Creative Tools</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#171322;color:#f8f3ff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 35px}main{max-width:760px;margin:auto}header{padding:20px 0}h1{margin:8px 0;font-size:28px}p,small{color:#c5bad4;line-height:1.55}a{color:#e1c5ff}.panel{background:#29223b;border:1px solid #5f4d75;border-radius:18px;padding:16px;margin:14px 0}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.group{background:#382b4c;border:1px solid #79618f;color:white;border-radius:16px;padding:18px 12px;text-align:left;min-height:105px}.group.active{background:#76509f;border-color:#dbb6ff}.group strong{display:block;font-size:18px}.group small{display:block;margin-top:9px}.items{display:grid;gap:9px}.item{display:block;text-align:left;background:#322841;border:1px solid #675379;border-radius:13px;color:white;padding:14px;width:100%}.item.selected{border-color:#e0b8ff;background:#54376d}.item strong{display:block}.item small{display:block;margin-top:5px}button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea,select{width:100%;background:#171324;border:1px solid #725e86;border-radius:10px;color:white;padding:12px;margin:6px 0 12px}textarea{min-height:100px}.primary{background:#d7b5ff;color:#24152f;border:0;border-radius:11px;padding:12px 16px;font-weight:bold}.back{background:transparent;border:0;color:#d9b9ff;padding:12px 0}.muted{font-size:13px}.hidden{display:none!important}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{font-size:12px;color:#e7d2ff;border:1px solid #9275ae;border-radius:30px;padding:4px 8px}@media(max-width:370px){.groups{grid-template-columns:1fr}}</style></head><body><main><header><a href="./studio.html">← Idea Studioに戻る</a><h1>✦ World Atlas</h1><p>設定を種類ごとに折りたたんで表示します。見たい分類だけを開くので、線が絡み合うことはありません。</p></header><div class="panel"><div class="heading"><h2>世界観の全体像</h2><span class="badge" id="count"></span></div><div id="groups" class="groups"></div></div><section id="detail-list" class="panel hidden"><button id="back" class="back">← 全分類へ</button><div class="heading"><h2 id="group-title"></h2><span class="badge" id="group-count"></span></div><input id="search" type="search" placeholder="この分類の設定を検索"><div id="items" class="items"></div></section><section id="editor" class="panel hidden"><h2>設定の詳細</h2><label>名称<input id="title"></label><label>分類<select id="type"><option>世界観</option><option>国家</option><option>人物</option><option>能力</option><option>事件</option><option>組織</option><option>その他</option></select></label><label>説明<textarea id="description"></textarea></label><button id="save" class="primary">変更を保存</button><p id="feedback" role="status"></p></section><p class="muted">既存の86件を含む世界観ツリーの保存データをそのまま使用します。Notion原本には書き込みません。</p></main><script>(()=>{'use strict';const KEY='creative-idea-studio-v1',$=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.nodes))data={nodes:[],ideas:[]};let category=null,selected=null;const categories=['国家','人物','能力','組織','事件','世界観','その他'],icons={'国家':'🏰','人物':'👥','能力':'✦','組織':'⚜','事件':'⚡','世界観':'🌌','その他':'◇'};const nodes=()=>data.nodes.filter(n=>n&&n.id!=='root'&&typeof n.title==='string'&&typeof n.id==='string');const folder=n=>n.parent==='root'&&categories.includes(n.title)&&n.type==='世界観'&&n.detail==='自動作成した分類フォルダ';function getType(n){if(folder(n))return null;if(categories.includes(n.type)&&n.type!=='世界観')return n.type;let p=data.nodes.find(x=>x.id===n.parent);if(p&&folder(p))return p.title;return categories.includes(n.type)?n.type:'その他'}function groupNodes(c){return nodes().filter(n=>getType(n)===c)}function drawGroups(){const all=nodes().filter(n=>!folder(n));$('count').textContent=all.length+'件';$('groups').innerHTML='';categories.forEach(c=>{const list=groupNodes(c);if(!list.length)return;const b=document.createElement('button');b.className='group'+(category===c?' active':'');const title=document.createElement('strong');title.textContent=(icons[c]||'◇')+' '+c;const count=document.createElement('small');count.textContent=list.length+'件の設定';b.append(title,count);b.onclick=()=>{category=c;selected=null;$('editor').classList.add('hidden');$('search').value='';drawGroups();drawList();$('detail-list').classList.remove('hidden');$('detail-list').scrollIntoView({behavior:'smooth',block:'start'})};$('groups').appendChild(b)})}function drawList(){if(!category)return;const list=groupNodes(category),q=$('search').value.trim().toLowerCase();$('group-title').textContent=(icons[category]||'◇')+' '+category;$('group-count').textContent=list.length+'件';$('items').replaceChildren();list.filter(n=>(n.title+' '+(n.detail||'')).toLowerCase().includes(q)).forEach(n=>{const b=document.createElement('button');b.className='item'+(selected===n.id?' selected':'');const title=document.createElement('strong');title.textContent=n.title;const detail=document.createElement('small');detail.textContent=(n.detail||'説明なし').slice(0,100);b.append(title,detail);b.onclick=()=>{selected=n.id;drawList();showEditor();$('editor').scrollIntoView({behavior:'smooth',block:'nearest'})};$('items').appendChild(b)});if(!$('items').children.length)$('items').textContent='該当する設定はありません。'}function showEditor(){const n=data.nodes.find(x=>x.id===selected);$('editor').classList.toggle('hidden',!n);if(!n)return;$('title').value=n.title;$('description').value=n.detail||'';$('type').value=categories.includes(n.type)?n.type:'その他';$('feedback').textContent=''}$('search').oninput=drawList;$('back').onclick=()=>{category=null;selected=null;$('detail-list').classList.add('hidden');$('editor').classList.add('hidden');drawGroups();window.scrollTo({top:0,behavior:'smooth'})};$('save').onclick=()=>{const n=data.nodes.find(x=>x.id===selected),title=$('title').value.trim();if(!n||!title)return $('feedback').textContent='名称を入力してください';const old={...n};n.title=title;n.detail=$('description').value;n.type=$('type').value;try{localStorage.setItem(KEY,JSON.stringify(data));$('feedback').textContent='保存しました';drawGroups();drawList()}catch{Object.assign(n,old);$('feedback').textContent='保存できませんでした'}};drawGroups()})();</script></body></html>
