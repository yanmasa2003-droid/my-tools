<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b25"><title>Growth Radar | カイの咆哮</title><style>:root{font-family:system-ui;background:#111b25;color:#f2e9d8}body{margin:auto;max-width:760px;padding:18px;background:radial-gradient(ellipse at top,#344650,transparent 55%)}h1,h2{font-family:Georgia,"Yu Mincho",serif;font-weight:500}h1{font-size:37px}a{color:#e2c68f}p{color:#c0bdb4;line-height:1.7}.card{background:#22323b;border:1px solid #796a4d;padding:16px;border-radius:5px;margin:12px 0}.item{border-top:1px solid #665e4d;padding:15px 0}.tag{display:inline-block;color:#e2c68f;border:1px solid #796a4d;border-radius:25px;padding:4px 9px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:10px;border:1px solid #796a4d;border-radius:4px}button{background:#e2c68f;color:#15212b;cursor:pointer}select,input{background:#172530;color:white;max-width:100%}input{width:100%;box-sizing:border-box}.muted{font-size:12px}.reason{color:#f0d8a9}.score{font-size:12px;color:#e2c68f}.pill{background:#364850;color:#eee;padding:4px 9px;border-radius:30px;font-size:12px}</style><a href="./studio.html">← Idea Studio</a><h1>✧ Growth Radar</h1><p>世界観の記録から、次に考える価値のあるテーマを探す。答えを決めつけず、創作の問いを発見します。</p><div class="card"><h2>探索の設定</h2><label>探索範囲 <select id="category"><option value="">すべて</option><option>人物</option><option>国家</option><option>能力</option><option>組織</option><option>事件</option><option>世界観</option><option>その他</option></select></label><label>表示 <select id="mode"><option value="priority">優先度順</option><option value="short">記述の少ない順</option></select></label><button id="scan">設定をスキャン</button><p id="summary"></p><p class="muted">端末内の世界観ツリーを解析します。文章の意味を理解するAI判定ではなく、記述量・関連数・キーワードを用いた探索支援です。</p></div><div class="card"><h2>発展テーマの候補</h2><div id="results"></div></div><div class="card"><h2>今回の検討リスト</h2><p>気になるテーマを保留・検討中・完了として管理できます。</p><div id="saved"></div></div><script>(()=>{'use strict';const SOURCE='creative-idea-studio-v1',KEY='creative-growth-radar-v1',$=id=>document.getElementById(id);let source;try{source=JSON.parse(localStorage.getItem(SOURCE))}catch{}const nodes=Array.isArray(source?.nodes)?source.nodes.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&n.id!=='root'&&n.detail!=='自動作成した分類フォルダ'):[];let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}if(!Array.isArray(saved))saved=[];const kinds=['人物','国家','能力','組織','事件','世界観','その他'];const findType=n=>kinds.includes(n.type)?n.type:'その他';const rules={人物:[['動機・目的',['目的','動機','望','理由','野望'],'何を望み、そのために何を犠牲にする人物なのか？'],['変化・選択',['変化','成長','選択','決断','葛藤'],'物語の前後で何が変わり、どんな選択が転機になる？'],['他者との関係',['仲間','敵','関係','家族','師','友'],'誰との関係がその人物の価値観を揺さぶる？']],国家:[['生活と文化',['生活','文化','習慣','食','祭','娯楽'],'その国の普通の一日はどんな景色になる？'],['利害と対立',['経済','政治','利権','戦争','対立','支配'],'誰が得をし、誰が不満を抱く仕組みなのか？'],['物語への影響',['事件','主人公','旅','物語','衝突'],'この国でしか起こせない事件は何か？']],能力:[['制約・代償',['制約','条件','代償','消耗','欠点','反動'],'強い力ほど、どんな限界や代償がドラマになる？'],['社会的な影響',['社会','仕事','制度','利用','産業'],'この能力が一般化すると社会の何が変わる？'],['例外と対抗策',['例外','対抗','弱点','無効','防御'],'どんな状況では通用せず、誰が対策を持つ？']],組織:[['理念と利害',['理念','目的','利益','方針','思想'],'掲げる理念と実際の利益は一致している？'],['内部対立',['派閥','対立','内部','腐敗','改革'],'内部で何を巡って意見が割れる？']],事件:[['原因と帰結',['原因','結果','影響','発端','その後'],'何が引き金となり、何を不可逆に変えた？'],['人物の選択',['選択','決断','行動','犠牲'],'誰の決断が事件を動かした？']],世界観:[['法則と例外',['法則','原理','条件','制約','例外'],'基本法則と例外は、読者にどう示される？'],['日常への浸透',['日常','社会','生活','文化','制度'],'世界の仕組みが普通の生活にどう現れる？']],その他:[['物語での役割',['物語','人物','事件','目的'],'この設定は物語のどの瞬間を面白くする？']]};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));return true}catch{alert('保存できませんでした');return false}},make=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e};function scan(){const chosen=$('category').value;const list=[];for(const n of nodes){const type=findType(n);if(chosen&&chosen!==type)continue;const detail=String(n.detail||'').replace(/\[出典:[^\]]+\]/g,'');const references=nodes.filter(x=>x.id!==n.id&&String(x.detail||'').includes(n.title)&&n.title.length>=3).length;const checks=rules[type]||rules.その他;for(const [label,words,question] of checks){const hits=words.filter(w=>detail.includes(w)).length;if(hits>=2&&detail.length>130)continue;const short=detail.trim().length<80;const score=(short?3:0)+(hits===0?3:1)+Math.min(3,references)+(type==='人物'||type==='能力'?1:0);list.push({node:n,label,question,score,length:detail.length,refs:references,reason:(short?'記述が比較的短い':'関連する記録がある')+'・この観点の記述を確認する価値があります'})}}list.sort((a,b)=>$('mode').value==='short'?a.length-b.length:b.score-a.score||a.length-b.length);$('summary').textContent=nodes.length+'件の設定から'+list.length+'件の検討候補を抽出（表示上限30件）';const out=$('results');out.replaceChildren();if(!list.length)out.append(make('p','該当する候補がありません。'));list.slice(0,30).forEach(x=>{const box=make('div','','item');const top=make('div','','row');top.append(make('span',findType(x.node),'tag'),make('strong',x.node.title),make('span','探索優先度 '+x.score,'score'));box.append(top,make('h3',x.label),make('p',x.question,'reason'),make('p',x.reason+'（関連記述 '+x.refs+'件）','muted'));const actions=make('div','','row');const add=make('button','検討リストへ追加');add.onclick=()=>{if(saved.some(i=>i.nodeId===x.node.id&&i.label===x.label))return alert('すでに追加済みです');saved.push({id:id(),nodeId:x.node.id,title:x.node.title,label:x.label,question:x.question,status:'検討中'});save();renderSaved()};const quest=make('button','Idea Questで考える');quest.onclick=()=>{try{localStorage.setItem('creative-quest-topic-draft',x.node.title+'：'+x.label)}catch{}location.href='./quest.html'};actions.append(add,quest);box.append(actions);out.append(box)})}function renderSaved(){const out=$('saved');out.replaceChildren();if(!saved.length){out.append(make('p','まだ登録された検討テーマはありません。'));return}saved.forEach(i=>{const box=make('div','','item');box.append(make('strong',i.title+' / '+i.label),make('p',i.question));const row=make('div','','row'),status=make('select');['検討中','保留','完了'].forEach(v=>{const o=make('option',v);o.value=v;status.append(o)});status.value=i.status;status.onchange=()=>{i.status=status.value;save()};const del=make('button','削除');del.onclick=()=>{if(!confirm('検討リストから削除しますか？'))return;saved=saved.filter(x=>x.id!==i.id);save();renderSaved()};row.append(status,del);box.append(row);out.append(box)})}$('scan').onclick=scan;$('category').onchange=scan;$('mode').onchange=scan;scan();renderSaved()})();</script>
