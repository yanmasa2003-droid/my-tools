<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171126"><title>Creative Tools</title><link rel="manifest" href="./manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#171126;color:#f7efff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto}header{padding:28px 0}h1{margin:8px 0;font-size:30px}p,small{color:#bcb0cd;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.panel{background:#28203b;border:1px solid #544466;border-radius:17px;padding:17px}.tile{color:inherit;text-align:left;font-size:16px;min-height:105px}.tile span{display:block;font-size:26px;margin-bottom:10px}.panel{margin-top:15px}.back{border:0;background:transparent;color:#d4afff;padding:12px 0;font-size:16px}label{display:block;margin:12px 0 5px;color:#dfcbea}input,textarea,select{display:block;width:100%;background:#181326;color:white;border:1px solid #655273;border-radius:10px;padding:12px;font-size:16px}textarea{min-height:150px}.action{background:#d4b3ff;color:#24132f;border:0;border-radius:10px;padding:13px 16px;margin:12px 8px 8px 0;font-weight:bold}.status{display:inline-block;border:1px solid #9d7dbb;border-radius:20px;padding:3px 9px;font-size:12px;color:#ead7ff;margin:6px 0}.filter{margin:14px 0}.entry{padding:12px 0;border-top:1px solid #584769;white-space:pre-wrap;overflow-wrap:anywhere}.entry button{float:right;background:transparent;color:#ffb6c2;border:0}.hidden{display:none!important}.tip{border-left:3px solid #c6a1ff;padding-left:12px}footer{margin:30px 0;font-size:12px;color:#aaa0b9}</style></head><body><main><header><small>PRIVATE NOTES · LOCAL STORAGE</small><h1>✦ Creative Tools</h1><p>物語の発想と設定を整理する、iPhone用の創作ノート。</p></header><div style="margin:0 0 18px;padding:16px;border:1px solid #9876bc;border-radius:16px;background:#342549"><strong>✦ 新機能：Idea Studio</strong><p>世界観ツリー・SCAMPER・マインドマップ・アイデア進化ツリーを試せます。</p><a href="./studio.html" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#d4b3ff;color:#24132f;font-weight:700;text-decoration:none">発想スタジオを開く</a></div><nav id="menu" class="grid"><button class="tile" data-page="発想スタジオ"><span>✨</span>発想スタジオ</button><button class="tile" data-page="世界観"><span>🌌</span>世界観・設定</button><button class="tile" data-page="キャラクター"><span>👥</span>キャラクター</button><button class="tile" data-page="プロット"><span>🧩</span>プロット・課題</button><button class="tile" data-page="発想の種"><span>💡</span>発想の種</button><button class="tile" data-page="自由メモ"><span>📝</span>創作メモ</button><button class="tile" data-page="一括取り込み"><span>📥</span>設定の一括取り込み</button><button class="tile" data-page="バックアップ"><span>🔐</span>バックアップ</button></nav><section id="page" class="hidden"><button class="back" id="back">← 一覧へ</button><h2 id="heading"></h2><div id="content" class="panel"></div></section><footer>創作データはこの端末のブラウザ保存領域にのみ保存されます。アプリ本体に作品固有の設定は含めていません。Safariのデータ削除や端末故障で消える可能性があるため、定期的にバックアップしてください。</footer></main><script>(()=>{'use strict';const K='creative-tools-private-v2',menu=document.querySelector('#menu'),page=document.querySelector('#page'),content=document.querySelector('#content'),heading=document.querySelector('#heading');const prompts=['主人公が信念のために損をする場面は？','味方同士の目的が衝突する瞬間は？','便利な力にどんな代償を設ける？','敵を倒さずに解決する方法は？','日常風景で世界の独自性を見せるには？','序盤に示す謎を終盤でどう回収する？'];let index=0;const read=()=>{try{const x=JSON.parse(localStorage.getItem(K)||'[]');return Array.isArray(x)?x:[]}catch{return []}},save=a=>{try{localStorage.setItem(K,JSON.stringify(a));return true}catch{alert('保存できませんでした');return false}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function list(){const node=document.querySelector('#entries');if(!node)return;const all=read(),filter=document.querySelector('#filter')?.value||'すべて',query=(document.querySelector('#search')?.value||'').trim().toLocaleLowerCase('ja'),category=document.querySelector('#category-filter')?.value||'すべて';const data=all.map((x,i)=>({...x,_index:i})).filter(x=>(filter==='すべて'||(x.status||'未分類')===filter)&&(category==='すべて'||x.category===category)&&(!query||[x.title,x.body,x.category].some(v=>String(v||'').toLocaleLowerCase('ja').includes(query))));node.innerHTML=data.length?data.map((x,i)=>'<div class="entry"><button data-del="'+x._index+'">削除</button><strong>'+esc(x.category)+' / '+esc(x.title)+'</strong><div><span class="status">'+esc(x.status||'未分類')+'</span></div><p>'+esc(x.body)+'</p><small>'+esc(x.date)+'</small><div><button type="button" data-related="'+x._index+'">関連候補を見る</button><div class="hidden" data-related-panel="'+x._index+'"></div></div></div>').join(''):'<p>保存したメモはありません。</p>';node.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.related),source=read()[idx],all=read();if(!source)return;const tokenize=t=>[...new Set(String(t||'').toLocaleLowerCase('ja').match(/[一-龯々ぁ-んァ-ヶーa-z0-9]{2,}/g)||[])].filter(x=>x.length>=2&&x.length<=32);const keys=tokenize((source.title||'')+' '+(source.body||'').slice(0,300));const matches=all.map((x,i)=>({x,i,hit:keys.filter(k=>((x.title||'')+' '+(x.body||'')).toLocaleLowerCase('ja').includes(k))})).filter(v=>v.i!==idx&&v.hit.length).sort((a,b)=>b.hit.length-a.hit.length).slice(0,8);const panel=document.querySelector('[data-related-panel="'+idx+'"]');panel.innerHTML=matches.length?matches.map(v=>'<div class="entry"><strong>'+esc(v.x.title||'無題')+'</strong> <span class="status">'+esc(v.x.status||'未分類')+'</span><p>共通語：'+esc(v.hit.slice(0,5).join('、'))+'</p><details><summary>本文を見る</summary><p>'+esc(v.x.body||'')+'</p></details></div>').join(''):'<p>関連候補は見つかりませんでした。</p>';panel.classList.remove('hidden')});node.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){const a=read();a.splice(+b.dataset.del,1);if(save(a))list()}})}function editor(cat){content.innerHTML='<p>入力内容はこの端末内に保存されます。</p><label>分類<select id="cat">'+['世界観','キャラクター','プロット','作品課題','自由メモ'].map(x=>'<option'+(x===cat?' selected':'')+'>'+x+'</option>').join('')+'</select></label><label>状態<select id="status-select"><option>検討中</option><option>確定</option><option>保留</option></select></label><label>タイトル<input id="title" placeholder="タイトル"></label><label>内容<textarea id="body" placeholder="思いついたことを入力"></textarea></label><button class="action" id="save">保存する</button><p id="status" role="status"></p><h3>保存済みメモ</h3><label>キーワード検索<input id="search" type="search" placeholder="タイトル・内容から検索"></label><label>分類で絞り込み<select id="category-filter"><option>すべて</option><option>世界観</option><option>キャラクター</option><option>プロット</option><option>作品課題</option><option>自由メモ</option></select></label><label class="filter">状態で絞り込み<select id="filter"><option>すべて</option><option>確定</option><option>検討中</option><option>保留</option><option>未分類</option></select></label><div id="entries"></div>';document.querySelector('#save').onclick=()=>{const title=document.querySelector('#title').value.trim(),body=document.querySelector('#body').value.trim();if(!title&&!body){document.querySelector('#status').textContent='内容を入力してください';return}const a=read();a.unshift({category:document.querySelector('#cat').value,status:document.querySelector('#status-select').value,title:title||'無題',body,date:new Date().toLocaleString('ja-JP')});if(save(a)){document.querySelector('#title').value='';document.querySelector('#body').value='';document.querySelector('#status').textContent='保存しました';list()}};document.querySelector('#filter').onchange=list;document.querySelector('#search').oninput=list;document.querySelector('#category-filter').onchange=list;list()}function open(id){menu.classList.add('hidden');page.classList.remove('hidden');heading.textContent=id;if(id==='一括取り込み'){content.innerHTML='<p>作品設定をまとめて取り込みます。データはこの端末にのみ保存されます。JSON配列または「分類［タブ］タイトル［タブ］内容［タブ］状態」の形式に対応します。</p><label>取り込む設定<textarea id="bulk-source" placeholder="世界観&#9;楔（シグナ）&#9;世界に刻まれた楔&#9;確定"></textarea></label><button class="action" id="bulk-preview">取り込み内容を確認</button><p id="bulk-feedback" role="status"></p><div id="bulk-preview-list"></div><button class="action hidden" id="bulk-commit">確認した設定を保存</button>';let pending=[];const parse=()=>{const raw=document.querySelector('#bulk-source').value.trim();if(!raw)return[];let items;if(raw.startsWith('[')||raw.startsWith('{')){const d=JSON.parse(raw);items=Array.isArray(d)?d:Array.isArray(d.notes)?d.notes:[];}else{items=raw.split(/\r?\n/).filter(Boolean).map(line=>{const parts=line.split('\t');if(parts.length<3)throw Error('各行に分類・タイトル・内容が必要です');return{category:parts[0],title:parts[1],body:parts[2],status:parts[3]||'検討中'}})}if(!Array.isArray(items)||items.length>500||!items.every(x=>x&&typeof x.category==='string'&&typeof x.title==='string'&&typeof x.body==='string'&&(!x.status||typeof x.status==='string')&&x.title.trim()&&x.body.trim()))throw Error('形式を確認してください（最大500件）');return items.map(x=>({category:x.category.trim()||'自由メモ',title:x.title.trim(),body:x.body.trim(),status:['確定','検討中','保留'].includes(x.status)?x.status:'検討中',date:new Date().toLocaleString('ja-JP')}))};document.querySelector('#bulk-preview').onclick=()=>{const feedback=document.querySelector('#bulk-feedback'),preview=document.querySelector('#bulk-preview-list'),commit=document.querySelector('#bulk-commit');pending=[];commit.classList.add('hidden');try{const parsed=parse(),existing=new Set(read().map(x=>x.category+'\u0000'+x.title)),seen=new Set();pending=parsed.filter(x=>{const key=x.category+'\u0000'+x.title;if(existing.has(key)||seen.has(key))return false;seen.add(key);return true});feedback.textContent='入力 '+parsed.length+'件／新規 '+pending.length+'件／重複 '+(parsed.length-pending.length)+'件（同じ分類とタイトルはスキップ）';preview.innerHTML=pending.slice(0,30).map(x=>'<div class="entry"><strong>'+esc(x.category)+' / '+esc(x.title)+'</strong><span class="status">'+esc(x.status)+'</span><p>'+esc(x.body.slice(0,160))+'</p></div>').join('')+(pending.length>30?'<p>ほか '+(pending.length-30)+'件</p>':'');if(pending.length)commit.classList.remove('hidden')}catch(e){feedback.textContent='取り込み形式を確認してください：'+(e.message||'読み込み不可');preview.textContent=''}};document.querySelector('#bulk-commit').onclick=()=>{if(!pending.length)return;if(!confirm(pending.length+'件の設定を追加しますか？'))return;if(save([...pending,...read()])){document.querySelector('#bulk-feedback').textContent=pending.length+'件保存しました';pending=[];document.querySelector('#bulk-commit').classList.add('hidden')}};return}if(id==='バックアップ'){content.innerHTML='<p>JSONファイルを定期的に保存してください。</p><button class="action" id="download">バックアップを書き出す</button><label>バックアップを読み込む<input id="upload" type="file" accept=".json,application/json"></label><p id="status" role="status"></p>';document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({format:'creative-tools-v2',notes:read()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='creative-tools-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelector('#upload').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.format!=='creative-tools-v2'||!Array.isArray(d.notes)||d.notes.length>10000||!d.notes.every(x=>x&&['title','body','category','date'].every(k=>typeof x[k]==='string')))throw Error();if(save([...d.notes,...read()]))document.querySelector('#status').textContent=d.notes.length+'件読み込みました'}catch{document.querySelector('#status').textContent='読み込みに失敗しました'}};return}if(id==='発想スタジオ'){const modes=[['発想','新しい案を広げる'],['比較','複数案を比べる'],['検証','矛盾や弱点を探す'],['質問','問いを深める']];content.innerHTML='<p>テーマとモードを選ぶと、検討用の問いを作成します。AI自動生成ではありません。</p><label>検討テーマ<input id="studio-topic" placeholder="例：第一門の名称"></label><label>思考モード<select id="studio-mode">'+modes.map(x=>'<option value="'+x[0]+'">'+x[0]+' — '+x[1]+'</option>').join('')+'</select></label><button class="action" id="studio-run">問いを作る</button><div id="studio-result" aria-live="polite"></div><button class="action hidden" id="studio-save">検討メモとして保存</button><button class="action" id="studio-ai">ChatGPTで深掘りする</button><p><small>作品設定のメモを選んでChatGPTに渡せます。内容は共有操作時にChatGPTへ送られます。</small></p><label>参照する設定<select id="studio-context"><option value="all">保存済みメモから選択（最大20件）</option><option value="none">参照しない</option></select></label><div class="panel"><h3>ChatGPTの結果を取り込む</h3><p>ChatGPTの回答をコピーして貼り付け、確認して保存します。自動同期ではありません。</p><label>保存するタイトル<input id="return-title" placeholder="例：第一門の名称"></label><label>保存先<select id="return-category"><option>世界観</option><option>キャラクター</option><option>プロット</option><option>作品課題</option><option>自由メモ</option></select></label><label>状態<select id="return-status"><option>検討中</option><option>確定</option><option>保留</option></select></label><label>ChatGPTの回答<textarea id="return-body" placeholder="回答をここに貼り付け"></textarea></label><label><input type="checkbox" id="return-replace" style="display:inline;width:auto"> 同じ分類・タイトルの既存メモを更新する（確認あり）</label><button class="action" id="return-save">内容を確認して保存</button><p id="return-feedback" role="status"></p></div>';let output='';document.querySelector('#studio-run').onclick=()=>{const topic=document.querySelector('#studio-topic').value.trim(),mode=document.querySelector('#studio-mode').value;if(!topic){document.querySelector('#studio-result').textContent='テーマを入力してください';return}const qs={発想:['既存設定と異なる方向の案は？','予想外の組み合わせは？','読者にとって魅力的な変化は？'],比較:['各案の長所・短所は？','既存設定との整合性は？','採用しない選択肢は？'],検証:['矛盾する既存設定は？','物語に不要な要素は？','読者が疑問に感じる点は？'],質問:['なぜこの設定が必要？','別の立場ならどう考える？','何を決めれば次に進める？']};output='【'+mode+'】'+topic+'\n\n'+qs[mode].map((q,i)=>(i+1)+'. '+q).join('\n');document.querySelector('#studio-result').innerHTML='<div class="entry">'+esc(output)+'</div>';document.querySelector('#studio-save').classList.remove('hidden')};const select=document.querySelector('#studio-context');read().slice(0,20).forEach((x,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(x.category||'メモ')+' / '+(x.title||'無題');select.appendChild(o)});document.querySelector('#studio-ai').onclick=()=>{const topic=document.querySelector('#studio-topic').value.trim();if(!topic){alert('テーマを入力してください');return}const mode=document.querySelector('#studio-mode').value,selection=select.value,notes=read();const chosen=selection==='none'?[]:selection==='all'?notes.slice(0,20):notes[Number(selection)]?[notes[Number(selection)]]:[];const context=chosen.map(x=>'【'+(x.category||'メモ')+'：'+(x.title||'無題')+'】\\n'+(x.body||'')).join('\\n\\n').slice(0,9000);const prompt='『カイの咆哮』の創作支援。テーマ：'+topic+'。モード：'+mode+'。既存設定を尊重し、迎合せず①評価・修正・補正②作品事例からの追加提案③想定質問と返答の順に考察してください。未確定設定は断定しないでください。\\n\\n参照メモ：\\n'+(context||'指定なし');const a=document.createElement('a');a.href='https://chatgpt.com/?q='+encodeURIComponent(prompt);a.target='_blank';a.rel='noopener noreferrer';a.click()};document.querySelector('#return-save').onclick=()=>{const title=document.querySelector('#return-title').value.trim()||document.querySelector('#studio-topic').value.trim(),body=document.querySelector('#return-body').value.trim(),category=document.querySelector('#return-category').value,status=document.querySelector('#return-status').value,feedback=document.querySelector('#return-feedback');if(!title||!body){feedback.textContent='タイトルと回答を入力してください';return}if(body.length>100000){feedback.textContent='回答が長すぎます。分割して保存してください';return}const a=read(),i=a.findIndex(x=>x.category===category&&x.title===title),replace=document.querySelector('#return-replace').checked;if(replace&&i>=0&&!confirm('既存メモ「'+title+'」を上書きします。元の内容は戻せません。続けますか？'))return;const entry={category,status,title,body,date:new Date().toLocaleString('ja-JP')};if(replace&&i>=0)a[i]=entry;else a.unshift(entry);if(save(a)){feedback.textContent=replace&&i>=0?'既存メモを更新しました':'新しいメモとして保存しました';document.querySelector('#return-body').value=''}};document.querySelector('#studio-save').onclick=()=>{const a=read();a.unshift({category:'作品課題',status:'検討中',title:document.querySelector('#studio-topic').value.trim(),body:output,date:new Date().toLocaleString('ja-JP')});if(save(a))alert('検討メモに保存しました')};return}if(id==='発想の種'){content.innerHTML='<p>発想のきっかけを提案します。</p><p class="tip" id="idea"></p><button class="action" id="next">別のお題</button><button class="action" id="memo">メモにする</button>';const show=()=>document.querySelector('#idea').textContent=prompts[index];show();document.querySelector('#next').onclick=()=>{index=(index+1)%prompts.length;show()};document.querySelector('#memo').onclick=()=>{const s=prompts[index];editor('自由メモ');document.querySelector('#title').value=s};return}editor(id==='自由メモ'?'自由メモ':id)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>open(b.dataset.page));document.querySelector('#back').onclick=()=>{page.classList.add('hidden');menu.classList.remove('hidden')};if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
