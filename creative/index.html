<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171126"><title>Creative Tools</title><link rel="manifest" href="./manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#171126;color:#f7efff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto}header{padding:28px 0}h1{margin:8px 0;font-size:30px}p,small{color:#bcb0cd;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.panel{background:#28203b;border:1px solid #544466;border-radius:17px;padding:17px}.tile{color:inherit;text-align:left;font-size:16px;min-height:105px}.tile span{display:block;font-size:26px;margin-bottom:10px}.panel{margin-top:15px}.back{border:0;background:transparent;color:#d4afff;padding:12px 0;font-size:16px}label{display:block;margin:12px 0 5px;color:#dfcbea}input,textarea,select{display:block;width:100%;background:#181326;color:white;border:1px solid #655273;border-radius:10px;padding:12px;font-size:16px}textarea{min-height:150px}.action{background:#d4b3ff;color:#24132f;border:0;border-radius:10px;padding:13px 16px;margin:12px 8px 8px 0;font-weight:bold}.status{display:inline-block;border:1px solid #9d7dbb;border-radius:20px;padding:3px 9px;font-size:12px;color:#ead7ff;margin:6px 0}.filter{margin:14px 0}.entry{padding:12px 0;border-top:1px solid #584769;white-space:pre-wrap;overflow-wrap:anywhere}.entry button{float:right;background:transparent;color:#ffb6c2;border:0}.hidden{display:none!important}.tip{border-left:3px solid #c6a1ff;padding-left:12px}footer{margin:30px 0;font-size:12px;color:#aaa0b9}</style></head><body><main><header><small>PRIVATE NOTES · LOCAL STORAGE</small><h1>✦ Creative Tools</h1><p>物語の発想と設定を整理する、iPhone用の創作ノート。</p></header><nav id="menu" class="grid"><button class="tile" data-page="世界観"><span>🌌</span>世界観・設定</button><button class="tile" data-page="キャラクター"><span>👥</span>キャラクター</button><button class="tile" data-page="プロット"><span>🧩</span>プロット・課題</button><button class="tile" data-page="発想の種"><span>💡</span>発想の種</button><button class="tile" data-page="自由メモ"><span>📝</span>創作メモ</button><button class="tile" data-page="バックアップ"><span>🔐</span>バックアップ</button></nav><section id="page" class="hidden"><button class="back" id="back">← 一覧へ</button><h2 id="heading"></h2><div id="content" class="panel"></div></section><footer>創作データはこの端末のブラウザ保存領域にのみ保存されます。アプリ本体に作品固有の設定は含めていません。Safariのデータ削除や端末故障で消える可能性があるため、定期的にバックアップしてください。</footer></main><script>(()=>{'use strict';const K='creative-tools-private-v2',menu=document.querySelector('#menu'),page=document.querySelector('#page'),content=document.querySelector('#content'),heading=document.querySelector('#heading');const prompts=['主人公が信念のために損をする場面は？','味方同士の目的が衝突する瞬間は？','便利な力にどんな代償を設ける？','敵を倒さずに解決する方法は？','日常風景で世界の独自性を見せるには？','序盤に示す謎を終盤でどう回収する？'];let index=0;const read=()=>{try{const x=JSON.parse(localStorage.getItem(K)||'[]');return Array.isArray(x)?x:[]}catch{return []}},save=a=>{try{localStorage.setItem(K,JSON.stringify(a));return true}catch{alert('保存できませんでした');return false}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function list(){const node=document.querySelector('#entries');if(!node)return;const all=read(),filter=document.querySelector('#filter')?.value||'すべて';const data=all.map((x,i)=>({...x,_index:i})).filter(x=>filter==='すべて'||(x.status||'未分類')===filter);node.innerHTML=data.length?data.map((x,i)=>'<div class="entry"><button data-del="'+x._index+'">削除</button><strong>'+esc(x.category)+' / '+esc(x.title)+'</strong><div><span class="status">'+esc(x.status||'未分類')+'</span></div><p>'+esc(x.body)+'</p><small>'+esc(x.date)+'</small></div>').join(''):'<p>保存したメモはありません。</p>';node.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){const a=read();a.splice(+b.dataset.del,1);if(save(a))list()}})}function editor(cat){content.innerHTML='<p>入力内容はこの端末内に保存されます。</p><label>分類<select id="cat">'+['世界観','キャラクター','プロット','作品課題','自由メモ'].map(x=>'<option'+(x===cat?' selected':'')+'>'+x+'</option>').join('')+'</select></label><label>状態<select id="status-select"><option>検討中</option><option>確定</option><option>保留</option></select></label><label>タイトル<input id="title" placeholder="タイトル"></label><label>内容<textarea id="body" placeholder="思いついたことを入力"></textarea></label><button class="action" id="save">保存する</button><p id="status" role="status"></p><h3>保存済みメモ</h3><label class="filter">状態で絞り込み<select id="filter"><option>すべて</option><option>確定</option><option>検討中</option><option>保留</option><option>未分類</option></select></label><div id="entries"></div>';document.querySelector('#save').onclick=()=>{const title=document.querySelector('#title').value.trim(),body=document.querySelector('#body').value.trim();if(!title&&!body){document.querySelector('#status').textContent='内容を入力してください';return}const a=read();a.unshift({category:document.querySelector('#cat').value,status:document.querySelector('#status-select').value,title:title||'無題',body,date:new Date().toLocaleString('ja-JP')});if(save(a)){document.querySelector('#title').value='';document.querySelector('#body').value='';document.querySelector('#status').textContent='保存しました';list()}};document.querySelector('#filter').onchange=list;list()}function open(id){menu.classList.add('hidden');page.classList.remove('hidden');heading.textContent=id;if(id==='バックアップ'){content.innerHTML='<p>JSONファイルを定期的に保存してください。</p><button class="action" id="download">バックアップを書き出す</button><label>バックアップを読み込む<input id="upload" type="file" accept=".json,application/json"></label><p id="status" role="status"></p>';document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({format:'creative-tools-v2',notes:read()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='creative-tools-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelector('#upload').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.format!=='creative-tools-v2'||!Array.isArray(d.notes)||d.notes.length>10000||!d.notes.every(x=>x&&['title','body','category','date'].every(k=>typeof x[k]==='string')))throw Error();if(save([...d.notes,...read()]))document.querySelector('#status').textContent=d.notes.length+'件読み込みました'}catch{document.querySelector('#status').textContent='読み込みに失敗しました'}};return}if(id==='発想の種'){content.innerHTML='<p>発想のきっかけを提案します。</p><p class="tip" id="idea"></p><button class="action" id="next">別のお題</button><button class="action" id="memo">メモにする</button>';const show=()=>document.querySelector('#idea').textContent=prompts[index];show();document.querySelector('#next').onclick=()=>{index=(index+1)%prompts.length;show()};document.querySelector('#memo').onclick=()=>{const s=prompts[index];editor('自由メモ');document.querySelector('#title').value=s};return}editor(id==='自由メモ'?'自由メモ':id)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>open(b.dataset.page));document.querySelector('#back').onclick=()=>{page.classList.add('hidden');menu.classList.remove('hidden')};if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
