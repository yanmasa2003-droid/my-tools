<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idea Quest</title><style>:root{font-family:system-ui;background:#111d28;color:#f1e9da}body{margin:auto;max-width:760px;padding:20px}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:40px}a{color:#e2c68f}.card{background:#22313b;border:1px solid #786a4c;border-radius:6px;padding:18px;margin:15px 0}p{color:#c0beb8;line-height:1.7}.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{border:1px solid #786a4c;padding:9px;font-size:12px}.active{background:#6a593e}button,input,select,textarea{font:inherit;padding:11px;margin:6px 0;border:1px solid #88734c;border-radius:4px}button{background:#dfc48a;color:#192630;cursor:pointer}input,select,textarea{width:100%;box-sizing:border-box;background:#15232d;color:white}textarea{min-height:100px}.hidden{display:none}.item{padding:12px;border-bottom:1px solid #786a4c}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.hint{color:#dfc48a}.small{font-size:12px}</style><a href="./studio.html">← Idea Studio</a><h1>✧ Idea Quest</h1><p>発散 → 交差 → 検証 → 評価 → 収束。創作を進める5つのステージ。</p><div id="steps" class="steps"></div><section class="card" id="setup"><h2>探検のテーマ</h2><input id="topic" placeholder="例：イーコールの正体"><select id="genre"><option>世界設定</option><option>人物</option><option>物語</option><option>演出</option></select><button id="start">新しい探検を始める</button><button id="resume">保存した続きから</button></section><section class="card hidden" id="spread"><h2>01 発散する</h2><p id="framework"></p><h2 id="question"></h2><div class="row"><button id="again">別の問い</button><button id="switch">別の発想法</button></div><textarea id="answer" placeholder="どんな案でも書き留める"></textarea><button id="collect">案を採集 ＋</button><p id="count"></p><div id="recent"></div><button id="go2">組み合わせへ →</button></section><section class="card hidden" id="mix"><h2>02 交差させる</h2><p>2つの案を組み合わせて、第三の案を生み出します。無理に組み合わせなくても構いません。</p><select id="first"></select><select id="second"></select><textarea id="blend" placeholder="組み合わせから生まれた新しい案"></textarea><button id="merge">派生案を採集</button><button id="go3">検証へ →</button></section><section class="card hidden" id="challenge"><h2>03 鍛える</h2><select id="target"></select><h2 id="challenge-question"></h2><textarea id="critique" placeholder="弱点、矛盾、改善策、読者への効果"></textarea><button id="save-critique">検証メモを保存</button><button id="go4">評価へ →</button></section><section class="card hidden" id="judge"><h2>04 比較する</h2><select id="candidate"></select><div id="ratings"></div><textarea id="reason" placeholder="点数では表せない長所や懸念"></textarea><button id="save-rating">評価を保存</button><div id="leaderboard"></div><button id="go5">結論へ →</button></section><section class="card hidden" id="finish"><h2>05 収束する</h2><select id="finalist"></select><select id="verdict"><option>採用候補</option><option>保留</option><option>不採用</option></select><textarea id="next" placeholder="次に確認・修正すること"></textarea><button id="save-verdict">結論を保存</button><div id="results"></div><button id="transfer">この案をIdea Studioへ転記</button><p id="status" class="hint"></p></section><section class="card"><h2>探検の操作</h2><div class="row"><button id="previous">← 前の段階</button><button id="download">JSONバックアップ</button></div><p class="small">途中経過は端末に自動保存されます。正式設定・Notionは自動変更しません。</p></section><script>(()=>{'use strict';const K='creative-idea-quest-v1',S='creative-idea-studio-v1',$=x=>document.getElementById(x),stages=['setup','spread','mix','challenge','judge','finish'],labels=['準備','発散','交差','検証','評価','収束'];let d;try{d=JSON.parse(localStorage.getItem(K))}catch{}if(!d||!Array.isArray(d.ideas))d={topic:'',genre:'世界設定',stage:0,ideas:[],method:0,prompt:0};const prompts=[['SCAMPER',['別の要素に置き換えると？','二つの設定を組み合わせると？','何かを取り除くと？','立場や因果を逆転すると？','別の用途に使うと？']],['逆転思考',['この案を最も退屈にするには？','敵ならどう悪用する？','常識を逆にすると？']],['ランダム接続',['この案と祭りが結びついたら？','秘密や誤解が絡んだら？','代償が必要になったら？']],['5 Whys',['なぜこの設定が必要？','なぜ人物に重要？','根本的な欲求は？','作品のテーマにどう響く？']]],tests=['最も強い反論は？','既存設定との矛盾は？','読者が好きになる瞬間は？','説明せずに描写するには？'],axes=['テーマとの整合','意外性','物語への貢献','設定の整合'];const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>{try{localStorage.setItem(K,JSON.stringify(d));return true}catch{alert('保存できませんでした');return false}},node=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e},selected=x=>d.ideas.find(i=>i.id===$(x).value),points=i=>Array.isArray(i.scores)?i.scores.reduce((a,b)=>a+Number(b),0):null;function select(id){const e=$(id),old=e.value;e.replaceChildren();d.ideas.forEach(i=>{const o=node('option',i.body.slice(0,60));o.value=i.id;e.append(o)});if(d.ideas.some(i=>i.id===old))e.value=old}function stage(n){d.stage=n;save();render();window.scrollTo(0,0)}function render(){$('steps').replaceChildren();labels.forEach((v,i)=>{const e=node('span',v);if(i===d.stage)e.className='active';$('steps').append(e)});stages.forEach((v,i)=>$(v).classList.toggle('hidden',i!==d.stage));$('previous').disabled=d.stage===0;if(d.stage===1){$('framework').textContent=prompts[d.method%4][0];$('question').textContent=prompts[d.method%4][1][d.prompt%prompts[d.method%4][1].length];$('count').textContent=d.ideas.length+'案を採集';$('recent').replaceChildren();d.ideas.slice(-4).forEach(i=>$('recent').append(node('p',i.body)))}if(d.stage===2){select('first');select('second');if(d.ideas.length>1&&$('first').value===$('second').value)$('second').selectedIndex=1}if(d.stage===3){select('target');loadTest()}if(d.stage===4){select('candidate');loadScores();leader()}if(d.stage===5){select('finalist');loadVerdict();results()}}function loadTest(){const i=selected('target');$('critique').value=i?.test||'';$('challenge-question').textContent=tests[Math.max(0,d.ideas.indexOf(i))%tests.length]}function loadScores(){const i=selected('candidate');$('ratings').replaceChildren();axes.forEach((a,j)=>{const label=node('label',a+'　');const sel=node('select','');sel.dataset.axis=j;for(let n=1;n<=5;n++){const opt=node('option',n);opt.value=n;sel.append(opt)}sel.value=i?.scores?.[j]||3;label.append(sel);$('ratings').append(label)});$('reason').value=i?.reason||''}function leader(){$('leaderboard').replaceChildren();d.ideas.filter(i=>points(i)!==null).sort((a,b)=>points(b)-points(a)).forEach(i=>$('leaderboard').append(node('p',points(i)+'/20点　'+i.body)))}function loadVerdict(){const i=selected('finalist');$('verdict').value=i?.verdict||'採用候補';$('next').value=i?.next||''}function results(){$('results').replaceChildren();d.ideas.filter(i=>i.verdict).forEach(i=>$('results').append(node('p',i.verdict+'｜'+i.body)))}$('start').onclick=()=>{const t=$('topic').value.trim();if(!t)return alert('テーマを入力してください');if(d.ideas.length&&!confirm('現在の探検を置き換えますか？ 先にバックアップを保存してください。'))return;d={topic:t,genre:$('genre').value,stage:1,ideas:[],method:0,prompt:0};stage(1)};$('resume').onclick=()=>{if(!d.topic)return alert('保存済みの探検がありません');stage(Math.max(1,d.stage))};$('again').onclick=()=>{d.prompt++;save();render()};$('switch').onclick=()=>{d.method++;d.prompt=0;save();render()};$('collect').onclick=()=>{const body=$('answer').value.trim();if(!body)return;d.ideas.push({id:uid(),body,method:prompts[d.method%4][0]});$('answer').value='';save();render()};$('go2').onclick=()=>{if(!d.ideas.length)return alert('1案以上採集してください');stage(2)};$('merge').onclick=()=>{const body=$('blend').value.trim();if(!body)return;const a=$('first').value,b=$('second').value;if(a===b)return alert('異なる案を選んでください');d.ideas.push({id:uid(),body,method:'交差',parents:[a,b]});$('blend').value='';save();render()};$('go3').onclick=()=>stage(3);$('target').onchange=loadTest;$('save-critique').onclick=()=>{const i=selected('target');if(i){i.test=$('critique').value;save()}};$('go4').onclick=()=>stage(4);$('candidate').onchange=loadScores;$('save-rating').onclick=()=>{const i=selected('candidate');if(!i)return;i.scores=[...document.querySelectorAll('[data-axis]')].map(e=>Number(e.value));i.reason=$('reason').value;save();leader()};$('go5').onclick=()=>stage(5);$('finalist').onchange=loadVerdict;$('save-verdict').onclick=()=>{const i=selected('finalist');if(!i)return;i.verdict=$('verdict').value;i.next=$('next').value;save();results()};$('previous').onclick=()=>stage(Math.max(0,d.stage-1));$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({format:K,...d},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='idea-quest.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('transfer').onclick=()=>{const i=selected('finalist');if(!i)return;let studio;try{studio=JSON.parse(localStorage.getItem(S))}catch{}if(!studio||!Array.isArray(studio.ideas)||!Array.isArray(studio.nodes))return $('status').textContent='Idea Studioのデータが見つかりません';if(studio.ideas.some(x=>x.questId===i.id))return $('status').textContent='転記済みです';studio.ideas.push({id:uid(),questId:i.id,title:d.topic,body:i.body+'\n検証：'+(i.test||'未実施')+'\n評価：'+(points(i)??'未評価')+'\n結論：'+(i.verdict||'未決定')+'\n次の一手：'+(i.next||''),parent:null,method:'Idea Quest',status:'検討中',date:new Date().toISOString()});try{localStorage.setItem(S,JSON.stringify(studio));$('status').textContent='Idea Studioへ転記しました'}catch{$('status').textContent='保存に失敗しました'}};$('topic').value=d.topic;$('genre').value=d.genre;render()})();</script>
