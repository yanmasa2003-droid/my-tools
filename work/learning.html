<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ed"><title>現場クエスト | Work Tools</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#25392f;background:#f6f4ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 95% 0%,#f9d9c4,transparent 38%),#f6f4ed}main{max-width:680px;margin:auto;padding:24px 18px 90px}a{color:#a96a50;text-decoration:none;font-size:13px;font-weight:800}.eyebrow{font-size:11px;color:#b56c4c;font-weight:900;letter-spacing:.14em;margin-top:28px}h1{font-size:32px;letter-spacing:-.05em;margin:8px 0}.sub{font-size:13px;color:#77877d;line-height:1.7}.hero{padding-bottom:16px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{border:1px solid #e6e8dc;background:#fffefa;border-radius:20px;padding:18px;text-align:left;min-height:155px;box-shadow:0 8px 24px #344b3a0d;color:#25392f}.mode strong{display:block;font-size:16px;margin:12px 0 6px}.mode small{font-size:11px;color:#7e8e81;line-height:1.5}.emoji{font-size:30px}.panel{background:#fffefa;border:1px solid #e9e8df;border-radius:22px;padding:18px;margin-top:18px;box-shadow:0 8px 25px #344b3a0e}.bar{height:9px;background:#e8ede6;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#69a18a;transition:width .3s}.status{display:flex;justify-content:space-between;align-items:center;color:#7d8d82;font-size:12px;margin-bottom:12px}.stage{font-size:21px;margin:16px 0 10px}.desc{font-size:13px;color:#6d7f71;line-height:1.7}.answers{display:grid;gap:10px;margin-top:18px}.choice{background:#f4f5ee;border:1px solid #e4e9de;border-radius:14px;padding:14px;text-align:left;font-size:14px;color:#263c30}.choice:disabled{opacity:.72}.choice.correct{background:#e0f1e5;border-color:#70a782}.choice.wrong{background:#fae4dc;border-color:#dc9d85}.feedback{padding:16px;border-radius:16px;background:#edf2e9;margin-top:15px;line-height:1.7;font-size:13px}.next{background:#315e4b;color:#fff;border:0;border-radius:14px;padding:14px 20px;margin-top:14px;font-weight:800;width:100%;font-size:15px}.scene{background:#dfece4;border-radius:20px;overflow:hidden;position:relative;margin-top:14px}.scene svg{display:block;width:100%;height:auto}.hotspot{position:absolute;border:2px dashed #d9805a;background:#fff7ebc9;color:#9b4e31;border-radius:12px;font-size:11px;font-weight:900;padding:7px 9px;cursor:pointer}.hotspot:disabled{opacity:.4}.hotspot.found{background:#c8e7d2;border-color:#4c9869;color:#245c3b;opacity:1}.scenehelp{font-size:12px;color:#5f7869;padding:11px 14px;background:#e4eee6}.hidden{display:none!important}.mini{font-size:12px;color:#7a897f}.result{font-size:30px;font-weight:900;color:#37664f}.back{border:0;background:none;color:#aa6c50;font-weight:800;padding:12px 0}.pill{display:inline-block;background:#e4efe5;color:#3f7358;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}.section{font-weight:800;margin:22px 0 12px}</style></head><body><main><a href="./">← Work Tools</a><header class="hero"><div class="eyebrow">LEARN BY PLAYING</div><h1>現場クエスト <span style="color:#d27c56">✦</span></h1><div class="sub">見つける・考える・判断する。<br>新人教育にも、自分の知識確認にも。</div></header><section id="menu"><div class="section">ゲームモードを選択</div><div class="modegrid"><button class="mode" data-mode="spot"><span class="emoji">🔎</span><strong>危険を探せ！</strong><small>接客カウンターのイラストから問題箇所を見つける</small></button><button class="mode" data-mode="mistake"><span class="emoji">🗣️</span><strong>説明のウソを見抜け</strong><small>接客トークに潜む誤りを見破る</small></button><button class="mode" data-mode="judge"><span class="emoji">⚡</span><strong>瞬間判断チャレンジ</strong><small>お客様への対応を4択で判断</small></button><button class="mode" data-mode="mix"><span class="emoji">🎲</span><strong>ミックスクエスト</strong><small>3種類を連続プレイしてスコアに挑戦</small></button></div><div class="panel"><span class="pill">学習のポイント</span><p class="sub">回答後に「なぜそう判断するのか」を解説。間違えても減点だけで終わらず、考え方を学べます。お客様の実データは使いません。</p></div></section><section id="game" class="hidden"><button class="back" id="quit">← モード選択</button><div class="panel"><div class="status"><span id="progressText"></span><strong id="score"></strong></div><div class="bar"><span id="progressBar"></span></div><h2 class="stage" id="question"></h2><p class="desc" id="description"></p><div id="visual"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="next hidden">次の問題へ →</button></div></section><section id="finish" class="panel hidden"><div class="eyebrow">QUEST COMPLETE</div><h2>クエスト完了！</h2><div id="finalScore" class="result"></div><p class="sub" id="finalText"></p><button class="next" id="again">もう一度遊ぶ</button><button class="back" id="return">モードを選ぶ</button></section><p class="sub" style="margin-top:26px">※教育用の一般的な事例です。実際の契約・個人情報管理・重要事項説明は最新の公式資料と社内ルールに従ってください。</p></main><script src="./learning.js"></script></body></html>
