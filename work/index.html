<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1c29"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>Work Tools</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1c29;color:#f3f8ff;font-family:system-ui,-apple-system,sans-serif;padding:24px 18px}main{max-width:560px;margin:auto}header{padding:16px 0 22px}h1{margin:8px 0;font-size:30px}p,small{color:#adbed0}nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.panel{background:#172b3a;border:1px solid #2d4557;border-radius:18px;padding:17px;color:inherit}.tile{text-align:left;min-height:120px;font-size:16px}.tile span{font-size:27px;display:block;margin-bottom:12px}.tile small{display:block;font-size:12px;margin-top:8px}.panel{margin-top:18px}.back{background:none;color:#8bcfff;border:0;padding:12px 0;font-size:16px}label{display:block;color:#b9ccdc;font-size:14px;margin-top:15px}input{width:100%;padding:12px;border-radius:10px;background:#0b1826;border:1px solid #4a6578;color:white;font-size:18px;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{font-size:30px;font-weight:750;margin:24px 0}.action{background:#78c5f5;border:0;border-radius:10px;padding:12px 16px;color:#102336;font-weight:700}footer{margin-top:40px;font-size:12px;color:#a0b3c6;line-height:1.7}button{cursor:pointer}</style></head><body><main><header><small>WORKSPACE</small><h1>Work Tools</h1><p>仕事を、もっとスマートに。</p></header><nav id="menu"></nav><div id="page" hidden><button class="back" id="back">← ツール一覧</button><h2 id="heading"></h2><div class="panel" id="content"></div></div><footer>顧客情報や社内機密は入力しないでください。料金・特典は最新の公式条件をご確認ください。<p><button class="back" id="refresh">↻ 最新版を確認</button></p></footer></main><script>
const defs=[['⏱','残業計算','時刻から分数を計算','overtime'],['💳','マネ活試算','任意還元率で概算','money'],['📱','料金比較','2プランの費用差','sales'],['🎓','新人教育','理解度クイズ','training']];
const menu=document.querySelector('#menu'),page=document.querySelector('#page'),content=document.querySelector('#content');
for(const [emoji,name,desc,id] of defs){const b=document.createElement('button');b.className='tile';b.innerHTML='<span>'+emoji+'</span>'+name+'<small>'+desc+'</small>';b.onclick=()=>open(id,name);menu.append(b)}
document.querySelector('#back').onclick=()=>{page.hidden=true;menu.hidden=false};document.querySelector('#refresh').onclick=()=>location.reload();
function open(id,name){menu.hidden=true;page.hidden=false;document.querySelector('#heading').textContent=name;
if(id==='overtime'){content.innerHTML='<div class="two"><label>残業開始<input type="time" id="start" value="18:45"></label><label>退勤時間<input type="time" id="end" value="20:40"></label></div><div class="result" id="result"></div><button class="action" id="copy">分数をコピー</button><p>日付をまたぐ退勤にも対応。休憩時間の控除はありません。</p>';const a=document.querySelector('#start'),b=document.querySelector('#end'),r=document.querySelector('#result');const min=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};const calc=()=>r.textContent=((min(b.value)-min(a.value)+1440)%1440)+'分';a.oninput=calc;b.oninput=calc;calc();document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(r.textContent.replace('分',''));document.querySelector('#copy').textContent='コピーしました'}catch{document.querySelector('#copy').textContent='コピーできませんでした'}}}
if(id==='money'){content.innerHTML='<p>任意の還元率による概算です。マネ活2の正式な上限・対象条件は反映していません。</p><label>対象利用額（円）<input id="spend" type="number" min="0" value="50000"></label><label>還元率（%）<input id="rate" type="number" min="0" step=".1" value="1"></label><div class="result" id="result"></div>';const a=document.querySelector('#spend'),b=document.querySelector('#rate'),r=document.querySelector('#result');const calc=()=>r.textContent=Math.floor(Math.max(0,+a.value||0)*Math.max(0,+b.value||0)/100).toLocaleString('ja-JP')+'円';a.oninput=calc;b.oninput=calc;calc()}
if(id==='sales'){content.innerHTML='<div class="two"><label>プランA（月額円）<input id="a" type="number" value="8010"></label><label>プランB（月額円）<input id="b" type="number" value="2971"></label></div><label>比較月数<input id="months" type="number" min="1" value="6"></label><div class="result" id="result"></div><p>手数料・割引条件・端末返却・料金変動は未反映。</p>';const a=document.querySelector('#a'),b=document.querySelector('#b'),m=document.querySelector('#months'),r=document.querySelector('#result');const calc=()=>{const d=((+a.value||0)-(+b.value||0))*Math.max(0,+m.value||0);r.textContent=d===0?'同額':(d>0?'B':'A')+'が '+Math.abs(d).toLocaleString('ja-JP')+'円安い'};[a,b,m].forEach(x=>x.oninput=calc);calc()}
if(id==='training'){content.innerHTML='<p>机にお客様の個人情報が書かれた書類が放置されています。適切な対応は？</p><button class="action" id="answer">答えを表示</button><p id="explain" aria-live="polite"></p>';document.querySelector('#answer').onclick=()=>document.querySelector('#explain').textContent='第三者から見えないよう速やかに保護し、社内の個人情報管理ルールに従って処理・報告します。'}
}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
