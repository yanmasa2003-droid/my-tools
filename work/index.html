<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ee"><link rel="manifest" href="./manifest.webmanifest"><title>Work Tools 2.0</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#26342f;background:#f8f5ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0%,#ffe1c6 0%,transparent 38%),radial-gradient(ellipse at 0% 70%,#e1eee4 0%,transparent 35%),#f8f5ee;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}main{max-width:620px;margin:auto;padding:26px 18px 110px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.19em;color:#c06a43}.hero{padding:20px 4px 24px}.hero h1{font-size:32px;letter-spacing:-.06em;margin:10px 0 6px}.muted,.note{color:#718078;font-size:13px;line-height:1.7}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}.section h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid #eee9e0;background:#fffdf9;border-radius:22px;padding:18px;text-align:left;min-height:132px;box-shadow:0 7px 22px #283c3010;color:#26342f}.tile .emoji{display:block;font-size:30px;margin-bottom:13px}.tile strong{display:block;font-size:15px}.tile small{display:block;color:#7c8982;margin-top:6px;font-size:11px;line-height:1.5}.tile:active{transform:scale(.98)}.banner{border-radius:23px;padding:20px;background:linear-gradient(120deg,#e5efe3,#f5e7d4);margin-bottom:14px}.banner strong{font-size:18px}.banner p{margin:7px 0 0;color:#63766a;font-size:13px}.panel{background:#fffdf9;border:1px solid #eee9e0;border-radius:24px;padding:20px;box-shadow:0 8px 25px #283c3010}.back{border:0;background:none;padding:12px 0;color:#ae6241;font-weight:750}.tooltitle{margin:10px 0 18px;font-size:26px}.field{display:block;margin:14px 0;font-size:13px;font-weight:700;color:#56655b}.field input,.field select{display:block;width:100%;margin-top:7px;border:1px solid #deded6;border-radius:13px;padding:13px;background:#fff;color:#24382b;font-size:17px;min-height:48px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#e9f1e7;border-radius:18px;padding:19px;margin:17px 0;font-size:25px;font-weight:800;overflow-wrap:anywhere}.action{background:#db7652;border:0;border-radius:14px;padding:13px 17px;color:#fff;font-weight:800;min-height:46px}.secondary{background:#edf1e9;color:#385447}.check{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.check input{width:21px;height:21px;accent-color:#58846d;flex-shrink:0}.check span{line-height:1.5}.pill{display:inline-block;padding:7px 10px;border-radius:30px;background:#eaf0e9;color:#577260;font-size:12px;margin:3px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffdf9ed;border-top:1px solid #e8e5de;backdrop-filter:blur(14px);padding:10px 8px max(12px,env(safe-area-inset-bottom));z-index:2}.tabs button{width:25%;max-width:145px;border:0;background:none;color:#829088;font-size:11px;padding:6px}.tabs button.active{color:#bf6847;font-weight:800}.tabs b{display:block;font-size:23px;margin-bottom:4px}.hide{display:none!important}footer{margin-top:26px;color:#879188;font-size:11px;line-height:1.7}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #de966f;outline-offset:2px}
</style></head><body><main><header class="hero"><div class="eyebrow">YOUR POCKET WORKSPACE</div><h1>Work Tools <span style="color:#d47751">2.0</span></h1><div class="muted">仕事の小さな手間を、もっと軽く。</div></header><div id="home"><div class="banner"><strong>今日も、スマートに。 ☀️</strong><p>必要なツールを選んですぐに使えます。</p></div><div class="section"><h2>クイックアクセス</h2></div><div class="grid" id="quick"></div><div class="section"><h2>すべてのツール</h2></div><div class="grid" id="all"></div></div><div id="category" class="hide"><div class="section"><h2 id="catname"></h2></div><div class="grid" id="catgrid"></div></div><div id="page" class="hide"><button class="back" id="back">← 戻る</button><h2 class="tooltitle" id="heading"></h2><div class="panel" id="content"></div></div><footer>顧客情報・社内機密は入力しないでください。料金・特典・必要書類は最新の公式情報と社内規定を必ず確認してください。<p><button class="back" id="refresh">↻ 更新を確認</button></p></footer></main><div class="tabs" id="tabs"></div><script>
const defs=[{id:'overtime',e:'⏱️',n:'残業計算',d:'時間を分単位で計算',cat:'calc'},{id:'money',e:'💳',n:'マネ活試算',d:'利用額と還元率',cat:'calc'},{id:'sales',e:'📱',n:'料金比較',d:'2プランの総額差',cat:'calc'},{id:'discount',e:'🪙',n:'割引・還元',d:'上限付きポイント計算',cat:'calc'},{id:'checklist',e:'✅',n:'手続きチェック',d:'確認漏れを防止',cat:'support'},{id:'documents',e:'🪪',n:'必要書類ナビ',d:'確認項目を整理',cat:'support'},{id:'training',e:'🎓',n:'理解度クイズ',d:'現場の安全確認',cat:'learn'}];
const $=s=>document.querySelector(s),home=$('#home'),category=$('#category'),page=$('#page'),content=$('#content');let currentTab='home';
const tabs=[['home','⌂','ホーム'],['calc','▦','計算'],['support','☑','業務'],['learn','▤','学習']];
function tile(d){const b=document.createElement('button');b.className='tile';b.innerHTML='<span class="emoji">'+d.e+'</span><strong>'+d.n+'</strong><small>'+d.d+'</small>';b.onclick=()=>openTool(d.id);return b}
function render(){const q=$('#quick'),a=$('#all');q.replaceChildren();a.replaceChildren();['overtime','money','checklist','documents'].forEach(id=>q.append(tile(defs.find(d=>d.id===id))));defs.forEach(d=>a.append(tile(d)));const t=$('#tabs');t.replaceChildren();tabs.forEach(([id,e,n])=>{const b=document.createElement('button');b.className=currentTab===id?'active':'';b.innerHTML='<b>'+e+'</b>'+n;b.onclick=()=>showTab(id);t.append(b)})}
function showTab(id){currentTab=id;page.classList.add('hide');home.classList.toggle('hide',id!=='home');category.classList.toggle('hide',id==='home');if(id!=='home'){$('#catname').textContent={calc:'計算ツール',support:'業務サポート',learn:'知識・学習'}[id];$('#catgrid').replaceChildren(...defs.filter(d=>d.cat===id).map(tile))}render();scrollTo(0,0)}
$('#back').onclick=()=>showTab(currentTab);$('#refresh').onclick=()=>location.reload();
const number=(id)=>Math.max(0,Number($('#'+id)?.value)||0),yen=n=>Math.floor(n).toLocaleString('ja-JP')+'円',field=(label,id,value,type='number')=>'<label class="field">'+label+'<input id="'+id+'" type="'+type+'" value="'+value+'"></label>';
function openTool(id){const d=defs.find(x=>x.id===id);home.classList.add('hide');category.classList.add('hide');page.classList.remove('hide');$('#heading').textContent=d.e+' '+d.n;content.replaceChildren();scrollTo(0,0);
if(id==='overtime'){content.innerHTML='<div class="two">'+field('残業開始','start','18:45','time')+field('退勤時刻','end','20:40','time')+'</div><div class="result" id="result"></div><button class="action" id="copy">分数をコピー</button><p class="note">日付またぎ対応。休憩控除なし。開始と終了が同時刻の場合は0分です。</p>';const min=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};const calc=()=>$('#result').textContent=((min($('#end').value)-min($('#start').value)+1440)%1440)+'分';['start','end'].forEach(x=>$('#'+x).oninput=calc);calc();$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#result').textContent.replace('分',''));$('#copy').textContent='コピーしました'}catch{$('#copy').textContent='コピーできませんでした'}}}
if(id==='money'){content.innerHTML='<p class="note">任意の還元率による概算です。マネ活2の正式条件・上限は反映していません。</p>'+field('対象利用額（円）','spend',50000)+field('還元率（%）','rate',1)+'<div class="result" id="result"></div>';const calc=()=>$('#result').textContent=yen(number('spend')*number('rate')/100);['spend','rate'].forEach(x=>$('#'+x).oninput=calc);calc()}
if(id==='sales'){content.innerHTML='<div class="two">'+field('プランA 月額','a',8010)+field('プランB 月額','b',2971)+'</div>'+field('比較月数','months',6)+'<div class="result" id="result"></div><p class="note">手数料・返却・料金変動・割引条件は未反映。</p>';const calc=()=>{const diff=(number('a')-number('b'))*number('months');$('#result').textContent=diff===0?'同額':(diff>0?'B':'A')+'が '+yen(Math.abs(diff))+'安い'};['a','b','months'].forEach(x=>$('#'+x).oninput=calc);calc()}
if(id==='discount'){content.innerHTML='<p class="note">一般的な割引・ポイント計算です。実際の適用条件や端数処理は特典ごとに異なります。</p>'+field('購入・利用額（円）','amount',50000)+field('値引き率（%）','off',0)+field('還元率（%）','point',5)+field('還元上限（円・0は上限なし）','cap',0)+'<div class="result" id="result"></div><div id="details" class="note"></div>';const calc=()=>{const amount=number('amount'),discount=Math.min(amount,Math.floor(amount*number('off')/100)),paid=amount-discount,raw=Math.floor(paid*number('point')/100),points=number('cap')?Math.min(raw,number('cap')):raw;$('#result').textContent='実質 '+yen(Math.max(0,paid-points));$('#details').textContent='値引き '+yen(discount)+' ／ 支払額 '+yen(paid)+' ／ 還元 '+yen(points)};['amount','off','point','cap'].forEach(x=>$('#'+x).oninput=calc);calc()}
if(id==='checklist'){const presets={mnp:['本人確認・契約者情報の確認','MNP手続き条件の確認','料金・割引・手数料の確認','端末・SIM・対応状況の確認','重要事項の説明','申込内容・同意の最終確認','開通・動作確認'],change:['本人確認・契約者情報の確認','現行契約・端末残債の確認','新端末・料金の確認','データ移行方法の案内','重要事項の説明','申込内容の最終確認','開通・動作確認'],new:['本人確認・契約条件の確認','支払方法の確認','料金・端末・割引の確認','重要事項の説明','申込内容の最終確認','開通・動作確認']};content.innerHTML='<label class="field">手続き種別<select id="kind"><option value="mnp">MNP</option><option value="change">機種変更</option><option value="new">新規契約</option></select></label><div id="checks"></div><p class="note">一般的な確認例です。正式な業務手順ではありません。顧客情報は記録しないでください。</p><button class="action secondary" id="clear">チェックをリセット</button>';function draw(){const kind=$('#kind').value,key='work-v2-check-'+kind,saved=JSON.parse(localStorage.getItem(key)||'[]');$('#checks').replaceChildren();presets[kind].forEach((item,i)=>{const label=document.createElement('label');label.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=saved.includes(i);const span=document.createElement('span');span.textContent=item;cb.onchange=()=>{const checked=[...$('#checks').querySelectorAll('input')].flatMap((x,j)=>x.checked?[j]:[]);localStorage.setItem(key,JSON.stringify(checked))};label.append(cb,span);$('#checks').append(label)})}$('#kind').onchange=draw;$('#clear').onclick=()=>{localStorage.removeItem('work-v2-check-'+$('#kind').value);draw()};draw()}
if(id==='documents'){content.innerHTML='<p class="note">書類の確定判定は行いません。契約条件に応じて、確認すべき項目を整理するナビです。</p><label class="field">手続き<select id="procedure"><option>機種変更</option><option>MNP</option><option>新規契約</option></select></label><label class="field">契約者<select id="holder"><option value="self">本人</option><option value="proxy">代理人が来店</option><option value="minor">未成年の契約</option><option value="corp">法人</option></select></label><div id="docresult"></div>';const draw=()=>{const type=$('#holder').value,proc=$('#procedure').value;let items=['契約者の本人確認書類（利用可能な種類・有効期限）','氏名・住所・生年月日などの一致','支払方法に関する書類・情報'];if(proc==='MNP')items.push('転入元の名義・MNP手続き状況');if(proc==='機種変更')items.push('現在の契約・端末・SIMの状況');if(type==='proxy')items.push('代理権限の証明・委任状等の要否','契約者と来店者それぞれの本人確認要件');if(type==='minor')items.push('親権者同意・年齢別条件・フィルタリング');if(type==='corp')items.push('法人確認書類・来店者の所属や権限・委任要件');$('#docresult').innerHTML='<div class="result" style="font-size:17px">確認する項目</div>'+items.map(x=>'<div class="check"><span>• '+x+'</span></div>').join('')+'<p class="note">書類の種類・原本要否・発行日条件・例外は最新の公式資料と社内規定で確認してください。個人情報を入力しないでください。</p>'};$('#procedure').onchange=draw;$('#holder').onchange=draw;draw()}
if(id==='training'){content.innerHTML='<p>机にお客様の個人情報が書かれた書類が放置されています。適切な対応は？</p><button class="action" id="answer">答えを表示</button><p id="explain" class="note" aria-live="polite"></p>';$('#answer').onclick=()=>$('#explain').textContent='第三者から見えないよう速やかに保護し、社内の個人情報管理ルールに従って処理・報告します。'}
}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
