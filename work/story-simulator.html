<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e9"><title>接客シミュレーション｜現場クエスト</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#293d33;font-family:system-ui,-apple-system,sans-serif}main{max-width:740px;margin:auto;padding:22px 15px 90px}a{color:#497e62;text-decoration:none;font-weight:800;font-size:13px}h1{font-size:29px;letter-spacing:-.05em;margin:12px 0}h2{font-size:21px;letter-spacing:-.035em;margin:8px 0}p{line-height:1.65}.muted{color:#77897c;font-size:13px}.eyebrow{color:#b77b52;letter-spacing:.15em;font-weight:900;font-size:11px}.card{border-radius:22px;background:#fffefb;border:1px solid #e4e7dc;padding:17px;margin:14px 0;box-shadow:0 8px 24px #395c4610}.meter{height:9px;background:#e5eee5;border-radius:10px;overflow:hidden;margin:13px 0}.meter span{display:block;height:100%;background:#74ac82;transition:width .2s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{background:#e5f0e7;color:#3f7555;border-radius:50px;padding:7px 11px;font-size:11px;font-weight:800}.scene{border-radius:18px;overflow:hidden;background:#e8efdf;margin:14px 0}.scene svg{width:100%;display:block}.bubble{border-radius:17px;padding:13px 15px;margin:12px 0;max-width:93%;font-size:14px;line-height:1.6}.customer{background:#f8e7d8}.staff{background:#e4f1e8;margin-left:auto}.choice{display:block;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid #dce6dc;background:#f5f8f2;color:#344e3e;margin:9px 0;font-weight:750;font-size:13px;line-height:1.55}.choice:disabled{opacity:.6}.choice.correct{border-color:#6fb58a;background:#e1f2e6}.choice.wrong{border-color:#d68b76;background:#f9e4dd}.btn{background:#365f4b;color:white;border:0;border-radius:14px;padding:15px;font-weight:900;width:100%;margin:12px 0;font-size:14px}.secondary{background:#f3f5ee;color:#456c53;border:1px solid #dce6d9}.feedback{background:#f0f3e7;border-radius:15px;padding:15px;margin:13px 0;font-size:13px;line-height:1.75}.hidden{display:none!important}.notes{display:flex;flex-wrap:wrap;gap:7px}.note{background:#f0e7d9;color:#846349;border-radius:11px;padding:9px 10px;font-size:12px}.sheet{background:#f8faf6;border:1px solid #dce6dc;border-radius:14px;padding:13px;margin:10px 0}.sheet div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e0e9de;font-size:13px}.sheet div:last-child{border:0}.hot{position:absolute;background:#ffe7b1c9;border:2px dashed #c57e45;border-radius:10px;font-size:11px;font-weight:900;color:#8b4f2e;min-width:70px;min-height:38px}.visual{position:relative}.foot{font-size:11px;color:#879587;line-height:1.7;margin-top:28px}</style></head><body><main><a href="./case-quest.html">← 現場クエスト</a><div class="eyebrow" style="margin-top:22px">STORY MODE / EPISODE 01</div><h1>接客ストーリー：機種変更の相談</h1><p class="muted">ヒアリング → 条件整理 → 比較 → 提案。お客様の反応があなたの判断で変わる、実践型シミュレーション。</p><div class="card"><div class="row"><span id="phase" class="tag">STAGE 1 / 5</span><span id="trust" class="tag">信頼 50</span></div><div class="meter"><span id="bar" style="width:0%"></span></div><div class="scene" id="art"></div><h2 id="heading"></h2><div id="dialogue"></div><div id="notes" class="notes"></div><div id="task"></div><div id="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="btn hidden">次へ進む →</button></div><div class="card hidden" id="result"><div class="eyebrow">EPISODE COMPLETE</div><h2 id="ending"></h2><p id="summary"></p><div id="breakdown"></div><button id="retry" class="btn">もう一度挑戦</button><a href="./case-quest.html">ほかのケースを選ぶ</a></div><p class="foot">架空の教育シミュレーションです。料金や端末価格は実例ではありません。実際の見積もり・契約条件は専用タブレットと最新の公式資料で確認してください。個人情報は入力しないでください。</p></main><script src="./story-simulator.js"></script></body></html>
