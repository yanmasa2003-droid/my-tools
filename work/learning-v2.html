<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ee"><title>現場クエスト 2.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#293c32;background:#f8f5ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 100% 0%,#f7dcc7,transparent 45%),#f8f5ee}main{max-width:720px;margin:auto;padding:22px 16px 90px}a{color:#a96e50;text-decoration:none;font-weight:700;font-size:13px}h1{font-size:32px;letter-spacing:-.05em;margin:10px 0}.intro{color:#7b8b80;font-size:13px;line-height:1.7}.tag{color:#bb7552;font-size:11px;letter-spacing:.16em;font-weight:900;margin-top:30px}.panel{background:#fffefa;border:1px solid #e9e8df;border-radius:24px;padding:18px;box-shadow:0 8px 28px #344b3a0d;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid #e8e7dd;background:#fffefa;border-radius:19px;padding:16px;text-align:left;min-height:120px;color:#263b30}.tile.active{border-color:#5b8e72;background:#e7f1e7;box-shadow:inset 0 0 0 1px #5b8e72}.tile b{display:block;margin-top:10px;font-size:14px}.tile small{display:block;margin-top:6px;color:#829087;font-size:11px}.emoji{font-size:26px}.section{margin:25px 0 12px;font-size:16px;font-weight:850}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{border:1px solid #e0e6dc;background:#fff;border-radius:99px;padding:10px 13px;color:#4f6d5d;font-size:12px}.chip.active{background:#365f4a;color:white}.btn{border:0;background:#365f4a;color:#fff;padding:15px;border-radius:15px;font-size:15px;font-weight:800;width:100%;margin-top:14px}.muted{color:#77887b;font-size:12px;line-height:1.7}.hidden{display:none!important}.bar{height:9px;background:#e8eee6;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#77a88b;transition:width .2s}.choice{display:block;width:100%;text-align:left;background:#f5f6ef;border:1px solid #e2e9df;border-radius:14px;padding:14px;margin-top:9px;color:#293c32;font-size:14px}.choice.correct{background:#e1f1e4;border-color:#5f9d72}.choice.wrong{background:#fbe7dd;border-color:#d99c7c}.choice:disabled{opacity:.75}.feedback{background:#edf3e8;border-radius:16px;padding:16px;margin-top:15px;font-size:13px;line-height:1.75}.feedback strong{display:block;margin:10px 0 3px}.scene{background:#e5efe6;border-radius:18px;overflow:hidden;margin:14px 0}.scene svg{display:block;width:100%;height:auto}.scenehelp{padding:10px 13px;color:#607b6a;font-size:12px}.spotoptions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.spotbtn{border:1px solid #d9e4d8;background:white;border-radius:13px;padding:12px;font-size:12px;color:#3c6450}.spotbtn.found{background:#cfe9d5;border-color:#57956e}.spotbtn.wrong{background:#f9e4da;border-color:#cc8c70}.score{font-size:32px;color:#3b7355;font-weight:900}.back{border:0;background:none;color:#a86a50;font-weight:800;padding:12px 0}.pill{display:inline-block;background:#e9f0e7;color:#557862;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:800}button:focus-visible{outline:3px solid #dca184;outline-offset:2px}</style></head><body><main><a href="./">← Work Tools</a><div class="tag">LEARN BY PLAYING</div><h1>現場クエスト <span style="color:#c47d56">2.0 ✦</span></h1><p class="intro">見る・考える・説明する。知識を実務判断に変えるミニゲーム。</p><section id="setup"><div class="section">01 / 学習ジャンル</div><div class="grid" id="categories"></div><div class="section">02 / 難易度</div><div class="row" id="levels"></div><div class="section">03 / プレイモード</div><div class="grid" id="modes"></div><button class="btn" id="start">クエストを開始 →</button><p class="muted">問題はランダム出題。解説は「正解の理由・誤解しやすい点・現場での説明」に分けています。</p></section><section id="game" class="hidden"><button class="back" id="back">← 選択画面へ</button><div class="panel"><div class="row"><span id="step" class="muted"></span><span id="points" class="pill"></span></div><div class="bar"><span id="progress"></span></div><div style="margin-top:14px" id="meta" class="pill"></div><h2 id="title"></h2><p class="intro" id="prompt"></p><div id="visual"></div><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="btn hidden">次へ →</button></div></section><section id="finish" class="panel hidden"><div class="tag">QUEST COMPLETE</div><h2>クエスト完了！</h2><div id="final" class="score"></div><p id="summary" class="intro"></p><button class="btn" id="again">もう一度遊ぶ</button><button class="back" id="home">ジャンルを選び直す</button></section><p class="muted" style="margin-top:26px">学習用の一般的な事例です。料金・特典・本人確認・補償の詳細条件は、最新の公式情報と社内規定を優先してください。</p></main><script src="./learning-data.js"></script><script src="./learning-v2.js"></script></body></html>
