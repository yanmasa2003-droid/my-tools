<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2e9"><title>現場クエスト｜ストーリーキャンペーン</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 95% 0%,#f3d5c2,transparent 36%),#f7f2e9;color:#294032;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 80px}a{color:#467d5b;font-size:13px;font-weight:850;text-decoration:none}h1{font-size:32px;letter-spacing:-.055em;margin:10px 0}h2{letter-spacing:-.04em}p{line-height:1.7}.eyebrow{color:#b97953;font-size:11px;font-weight:900;letter-spacing:.14em}.muted{font-size:13px;color:#788b7c}.hero{background:linear-gradient(125deg,#315d49,#6b997a);color:white;border-radius:23px;padding:22px;margin:20px 0}.hero p{color:#dbe9de;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:16px;padding:13px;text-align:center;border:1px solid #e2e8de}.stat strong{font-size:22px;display:block;color:#397354}.stat span{font-size:10px;color:#7d9080}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:17px 0}.episode{border:1px solid #e0e7dc;background:#fffefa;border-radius:19px;padding:15px;text-align:left;color:#294032;min-height:165px}.episode .emoji{font-size:30px}.episode b{display:block;margin:10px 0 6px;font-size:14px}.episode small{font-size:11px;color:#7c8d80}.tag{background:#e6f0e7;color:#457756;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:850}.card{background:#fffefa;border:1px solid #e3e8df;border-radius:22px;padding:19px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.meter{height:10px;background:#e8eee5;border-radius:99px;margin:14px 0;overflow:hidden}.meter span{height:100%;display:block;background:#71ab84;transition:width .2s}.scene{background:#e8f0e6;border-radius:19px;overflow:hidden;margin:14px 0}.scene svg{width:100%;display:block}.bubble{padding:15px;border-radius:18px;margin:12px 0;max-width:94%;font-size:14px;line-height:1.65}.customer{background:#f5e7da}.staff{background:#e4f0e7;margin-left:auto}.choice{display:block;width:100%;border:1px solid #dde8dd;background:#f5f8f3;border-radius:14px;padding:15px;text-align:left;margin:10px 0;font-size:13px;font-weight:750;color:#365443;line-height:1.6}.choice:disabled{opacity:.7}.choice.correct{background:#e1f2e5;border-color:#74b68b}.choice.wrong{background:#fae6df;border-color:#d68e77}.feedback{background:#f1f4e9;border-radius:15px;padding:15px;font-size:13px;line-height:1.7;margin:15px 0}.btn{border:0;border-radius:14px;background:#315d49;color:white;font-size:14px;font-weight:900;padding:15px;width:100%;margin:12px 0}.btn.secondary{background:#e6eee5;color:#365e48}.hidden{display:none!important}.note{background:#f2eadb;color:#816447;border-radius:11px;padding:9px;font-size:11px}.notes{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.footer{font-size:11px;color:#849487;margin-top:28px;line-height:1.7}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><a href="./case-quest.html">← 現場クエスト</a><div class="eyebrow" style="margin-top:24px">FIELD QUEST / STORY CAMPAIGN</div><h1>接客ストーリーキャンペーン</h1><p class="muted">現場の相談を最後まで担当する。判断によってお客様の反応と信頼度が変化します。</p><section id="lobby"><div class="hero"><div class="eyebrow" style="color:#cde9d5">STORY COLLECTION</div><h2>接客の「なぜ？」を攻略。</h2><p>8つの独立したエピソード。各4場面の判断と、分岐する会話、評価、復習を収録。</p></div><div class="stats"><div class="stat"><strong id="completed">0</strong><span>クリア</span></div><div class="stat"><strong id="perfect">0</strong><span>満点</span></div><div class="stat"><strong id="xp">0</strong><span>XP</span></div></div><h2>エピソードを選択</h2><div id="episodes" class="grid"></div></section><section id="play" class="hidden"><button class="btn secondary" id="exit">← エピソード一覧</button><div class="card"><div class="row"><span id="step" class="tag"></span><span id="trust" class="tag"></span></div><div class="meter"><span id="progress"></span></div><h2 id="title"></h2><div id="scene" class="scene"></div><div id="dialogue"></div><h3 id="question"></h3><div id="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div id="notes" class="notes"></div><button id="next" class="btn hidden">次の場面へ →</button></div></section><section id="result" class="hidden"><div class="card"><div class="eyebrow">EPISODE COMPLETE</div><h2 id="ending"></h2><p id="summary"></p><div id="review"></div><button id="retry" class="btn">もう一度挑戦する</button><button id="back" class="btn secondary">一覧に戻る</button></div></section><p class="footer">教育用の架空ケースです。実際の契約・割引・補償・本人確認は最新の公式資料と社内手順を確認してください。学習履歴はこの端末に保存されます。</p></main><script src="./campaign-data.js"></script><script src="./campaign-engine.js"></script></body></html>
